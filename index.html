                el("td",{},[{male:"男",female:"女",other:"他"}[s.gender]||""]),
                el("td",{style:{color:"var(--muted)",fontSize:"11px"}},[s.dob]),
              ]))),
            ])]),
          );
        } else if(!errs.length){
          previewEl.append(div({style:{color:"var(--muted)",fontSize:"13px",padding:"16px 0",textAlign:"center"}},["データが見つかりませんでした。ファイル形式を確認してください。"]));
        }
        errEl.className="hidden";
      }catch(err){
        showErr(errEl,"CSV解析エラー: "+err.message);
        parsed=[];
      }
  };

  const box=div({className:"mb",style:{maxWidth:"700px"}});
  box.append(
    mhdr("📂 CSVインポート",()=>ov.remove()),
    div({style:{padding:"clamp(16px,4vw,24px)",display:"flex",flexDirection:"column",gap:"16px"}},[
      // フォーマット説明
      div({style:{fontSize:"12px",color:"var(--muted)",padding:"12px",background:"var(--navy)",borderRadius:"8px",lineHeight:1.8}},[
        "対応フォーマット（タブ or カンマ区切り）：",el("br"),
        "SID　年　組　番　年組　姓　名　姓かな　名かな　姓名　性(m/f)　生年月日",el("br"),
        "※ 年「5」は高2（2年）に自動変換。ヘッダー行は自動スキップ。",
      ]),
      ff("CSVファイルを選択",fileI),
      previewEl,
      errEl,
    ]),
    div({style:{padding:"14px 24px",borderTop:"1px solid var(--border)",display:"flex",gap:"8px",justifyContent:"flex-end"}},[
      btn({className:"btn btn-g",onClick:()=>ov.remove()},["キャンセル"]),
      btn({className:"btn btn-p",onClick:async()=>{
        if(!parsed.length) return showErr(errEl,"先にCSVファイルを選択してください");
        // 重複チェック：同じ学年+組+番号がすでに存在する場合はスキップ
        let added=0, skipped=0;
        for(const s of parsed){
          const exists=S.students.find(x=>x.grade===s.grade&&x.cls===s.cls&&String(x.number)===String(s.number));
          if(exists){ skipped++; continue; }
          await DB.saveStudent(s);
          S.students.push(s);
          added++;
        }
        ov.remove();
        await onSave();
        if(skipped>0) alert(`✓ ${added}名を追加しました（${skipped}名は重複のためスキップ）`);
      }},["インポート実行"]),
    ]),
  );
  const ov=overlay(box,()=>ov.remove());
}

  let view="players";
  const rebuild=async()=>{
    root.innerHTML="";

    S.tournaments=await DB.getTournaments();

    ]));

    const rightCol=div({style:{flex:"1 1 400px",minWidth:0}});
    root.append(div({style:{display:"flex",gap:"20px",flexWrap:"wrap",alignItems:"flex-start"}},[leftCol,rightCol]));

    } else {
      recent.forEach(m=>{

          border:`1px solid ${m.result==="win"?"rgba(46,204,113,.3)":"rgba(232,69,69,.25)"}`,

        }});
        row.addEventListener("click",()=>{ if(st) openPlayerMatchModal(st,rebuild); });
        row.append(

            div({style:{display:"flex",gap:"5px",flexWrap:"wrap"}},[
              span({style:{fontWeight:700,color:"var(--text)"}},[st?st.name:"不明"]),
              badge(m.result==="win"?"b-g":"b-r",m.result==="win"?"勝":"負"),
              catL?badge("b-0",catL):"",
            ]),
            span({style:{color:"var(--muted)",fontSize:"10px"}},[m.date]),
          ]),
          div({style:{color:"var(--muted)"}},[`vs ${m.opponentName}（${m.opponentSchool}）`]),
          tn?div({style:{color:"var(--accent)",marginTop:"2px"}},[`🏆 ${tn}`]):
            div({style:{color:"var(--muted)",marginTop:"2px"}},["🎯 練習試合"]),
          scoreText?div({style:{color:"var(--muted)",marginTop:"2px"}},[`スコア: ${scoreText}`]):"",
        );
        leftCol.append(row);
      });
    }

    // ── 右：選手別 / 大会別 ──
    const viewBar=div({style:{display:"flex",gap:"6px",marginBottom:"14px"}});
    [["players","👤 選手別"],["tournaments","🏆 大会別"]].forEach(([k,l])=>{
      viewBar.append(btn({className:`sc ${view===k?"on":""}`,style:{fontSize:"12px"},onClick:()=>{view=k;rebuild();}},[l]));
    });
    const rightContent=div({});
    rightCol.append(viewBar,rightContent);

    if(view==="players"){
      const rows=S.students.map(s=>{
        const ms=S.matches.filter(m=>m.studentId===s.id);
        if(!ms.length)return null;
        const w=ms.filter(m=>m.result==="win").length;
        const tr=el("tr",{style:{cursor:"pointer"}});
        tr.addEventListener("click",()=>openPlayerMatchModal(s,rebuild));
        tr.append(
          el("td",{style:{fontWeight:600}},[s.name]),
          el("td",{style:{color:"var(--muted)"}},[`${s.grade}年${s.cls}組`]),
          el("td",{},[String(ms.length)]),
          el("td",{style:{color:"var(--green)"}},[String(w)]),
          el("td",{style:{color:"var(--red)"}},[String(ms.length-w)]),
          el("td",{},[`${Math.round(w/ms.length*100)}%`]),

        return tr;
      }).filter(Boolean);
      rightContent.append(rows.length?div({className:"tw"},[el("table",{},[
        el("thead",{},[el("tr",{},[el("th",{},["氏名"]),el("th",{},["学年/組"]),el("th",{},["試合"]),el("th",{},["勝"]),el("th",{},["負"]),el("th",{},["勝率"])])]),
        el("tbody",{},rows),
      ])]):emptyState("🏸","試合記録がありません"));
    } else {
      const pracMs=S.matches.filter(m=>m.type==="practice");
      const tList=[
        ...S.tournaments.sort((a,b)=>b.date.localeCompare(a.date)).map(t=>({
          id:t.id,name:t.name,date:t.date,isPractice:false,
          ms:S.matches.filter(m=>m.tournamentId===t.id),
        })),
        ...(pracMs.length?[{id:"practice",name:"練習試合（全件）",date:"",isPractice:true,ms:pracMs}]:[]),
      ];
      if(!tList.length){ rightContent.append(emptyState("🏆","大会が登録されていません")); }
      else tList.forEach(t=>{
        const w=t.ms.filter(m=>m.result==="win").length;
        const row=div({className:"card",style:{marginBottom:"10px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}});
        row.addEventListener("click",()=>openTournamentDetailModal(t,rebuild));

          div({},[
            div({style:{fontWeight:700,fontSize:"14px"}},[t.name]),
            div({style:{fontSize:"12px",color:"var(--muted)",marginTop:"4px"}},[
              t.date?`📅 ${t.date}　`:""," ",`${t.ms.length}試合 / ${w}勝${t.ms.length-w}敗`,
            ]),
          ]),
          span({style:{color:"var(--accent)",fontSize:"20px"}},["›"]),
        );
        rightContent.append(row);
      });
    }
  };
  rebuild();
}

function openTournamentModal(onSave,existing=null){
  let name=existing?.name||"", date=existing?.date||new Date().toISOString().slice(0,10), note=existing?.note||"";
  const box=div({className:"mb",style:{maxWidth:"420px"}}); const errEl=div({className:"hidden"});
  const nameI=inp({className:"inp",placeholder:"例：○○高校招待大会",value:name}); nameI.addEventListener("input",e=>name=e.target.value);
  const dateI=inp({className:"inp",type:"date",value:date}); dateI.addEventListener("input",e=>date=e.target.value);
  const noteI=ta({className:"inp",rows:2},note); noteI.addEventListener("input",e=>note=e.target.value);
  box.append(
    mhdr(existing?"大会を編集":"🏆 大会を登録",()=>ov.remove()),
    div({style:{padding:"24px",display:"flex",flexDirection:"column",gap:"14px"}},[
      ff("大会名 *",nameI), ff("開催日",dateI), ff("メモ",noteI), errEl,
    ]),
    mftr(()=>ov.remove(),async()=>{
      if(!name.trim()) return showErr(errEl,"大会名を入力してください");
      const t={id:existing?.id||genId(), name:name.trim(), date, note:note.trim(), createdAt:existing?.createdAt||new Date().toISOString()};
      await DB.saveTournament(t);
      if(existing){ const i=S.tournaments.findIndex(x=>x.id===t.id); if(i>=0)S.tournaments[i]=t; else S.tournaments.push(t); }
      else {
        S.tournaments.push(t);
        // 大会登録時に自動でチャットルームを作成
        const room={
          id:`tournament_${t.id}`,
          name:`🏆 ${t.name}`,
          sub:t.date||"",
          tournamentId:t.id,
          createdAt:new Date().toISOString(),
        };
        await DB.saveChatRoom(room);
        S.chatRooms.push(room);
      }
      ov.remove(); onSave();
    },existing?"更新":"登録"),
  );
  const ov=overlay(box,()=>ov.remove());
}

function openPlayerMatchModal(student,onUpdate){
  const box=div({className:"mb",style:{maxWidth:"640px"}});
  const listEl=div({});
  const buildList=()=>{
    listEl.innerHTML="";
    const ms=[...S.matches.filter(m=>m.studentId===student.id)].sort((a,b)=>b.date.localeCompare(a.date));
    if(!ms.length){listEl.append(emptyState("🏸","記録なし"));return;}
    ms.forEach(m=>{
      const tn=m.tournamentId?S.tournaments.find(t=>t.id===m.tournamentId)?.name||"大会":"練習試合";
      const catL={singles:"シングルス",doubles:"ダブルス",team:"団体戦"}[m.category]||m.category;
      const scoreText=m.scores?.length?m.scores.map(s=>`${s.my}-${s.opp}`).join(", "):"";
      const row=div({style:{padding:"12px 0",borderBottom:"1px solid var(--border)",display:"flex",gap:"10px",alignItems:"flex-start"}},[
        div({style:{flex:1}},[
          div({style:{display:"flex",gap:"6px",alignItems:"center",flexWrap:"wrap",marginBottom:"4px"}},[
            span({style:{fontSize:"12px",color:"var(--muted)"}},[m.date]),
            span({style:{fontSize:"12px",color:"var(--accent)"}},[m.type==="tournament"?`🏆 ${tn}`:"🎯 練習試合"]),
            badge("b-0",catL),
            badge(m.result==="win"?"b-g":"b-r",m.result==="win"?"勝ち":"負け"),
          ]),
          div({style:{fontSize:"13px",fontWeight:600}},[`vs ${m.opponentName}（${m.opponentSchool}）`]),
          scoreText?div({style:{fontSize:"12px",color:"var(--muted)"}},[`スコア: ${scoreText}`]):"",
          m.note?div({style:{fontSize:"12px",color:"var(--muted)"}},[`📝 ${m.note}`]):"",
        ]),
        btn({className:"btn btn-d sm",onClick:async()=>{
          if(!confirm("削除しますか？"))return;
          await DB.deleteMatch(m.id);
          S.matches=S.matches.filter(x=>x.id!==m.id);
          buildList(); onUpdate();
        }},["削除"]),
      ]);
      listEl.append(row);
    });
  };
  buildList();
  box.append(
    mhdr(`🏸 ${student.name}の試合記録`,()=>ov.remove()),
    div({style:{padding:"24px"}},[listEl]),
    div({style:{padding:"14px 24px",borderTop:"1px solid var(--border)",display:"flex",justifyContent:"flex-end"}},[
      btn({className:"btn btn-g",onClick:()=>ov.remove()},["閉じる"]),
    ]),
  );
  const ov=overlay(box,()=>ov.remove());
}

}

// 試合入力フォーム（教員・生徒共通）
function buildMatchForm(student, opts={}, onSave){
  // opts: { existingMatch } for edit
  const ex=opts.existingMatch||null;
  let mType=ex?.type||"practice";
  let mTournamentId=ex?.tournamentId||"";
  let mCategory=ex?.category||"singles";
  let mResult=ex?.result||"win";
  let mDate=ex?.date||new Date().toISOString().slice(0,10);
  let mOpponentName=ex?.opponentName||"";
  let mOpponentSchool=ex?.opponentSchool||"";
  let mNote=ex?.note||"";
  let mScoreMode=ex?.scores?.length?"score":"result";
  let mSets=ex?.scores?.length?ex.scores.map(s=>({my:String(s.my),opp:String(s.opp)})):[{my:"",opp:""}];

  const form=div({style:{display:"flex",flexDirection:"column",gap:"14px"}});
  const errEl=div({className:"hidden"});

  // 種別
  const typeBtns={};
  const typeRow=div({style:{display:"flex",gap:"8px"}});
  const tournamentWrap=div({style:{display:mType==="tournament"?"block":"none"}});
  [["practice","🎯 練習試合"],["tournament","🏆 大会"]].forEach(([v,l])=>{
    const b=btn({className:`sc ${mType===v?"on":""}`,style:{flex:1,justifyContent:"center"},onClick:()=>{
      mType=v; Object.keys(typeBtns).forEach(k=>typeBtns[k].classList.toggle("on",k===v));
      tournamentWrap.style.display=v==="tournament"?"block":"none";
    }},[l]);
    typeBtns[v]=b; typeRow.append(b);
  });

  // 大会選択
  const rebuildTournamentSel=()=>{
    tournamentWrap.innerHTML="";
    if(!S.tournaments.length){
      tournamentWrap.append(div({style:{fontSize:"12px",color:"var(--muted)",padding:"8px 12px",background:"var(--navy)",borderRadius:"8px"}},["大会が登録されていません。教員に大会登録を依頼してください。"]));
      return;
    }
    const ts=sel({className:"inp"},[
      opt("","— 大会を選択 —",!mTournamentId),
      ...S.tournaments.map(t=>opt(t.id,`${t.name}${t.date?` (${t.date})`:""}`,t.id===mTournamentId)),
    ]);
    ts.addEventListener("change",e=>mTournamentId=e.target.value);
    tournamentWrap.append(ff("大会名 *",ts));
  };
  rebuildTournamentSel();

  // カテゴリ
  const catBtns={};
  const catRow=div({style:{display:"flex",gap:"8px"}});
  [["singles","シングルス"],["doubles","ダブルス"],["team","団体戦"]].forEach(([v,l])=>{
    const b=btn({className:`sc ${mCategory===v?"on":""}`,style:{flex:1,justifyContent:"center"},onClick:()=>{
      mCategory=v; Object.keys(catBtns).forEach(k=>catBtns[k].classList.toggle("on",k===v));
    }},[l]);
    catBtns[v]=b; catRow.append(b);
  });

  // 日付・相手
  const dateI=inp({className:"inp",type:"date",value:mDate}); dateI.addEventListener("input",e=>mDate=e.target.value);
  const oppNameI=inp({className:"inp",placeholder:"相手の名前・チーム名",value:mOpponentName}); oppNameI.addEventListener("input",e=>mOpponentName=e.target.value);
  const oppSchoolI=inp({className:"inp",placeholder:"相手の学校名",value:mOpponentSchool}); oppSchoolI.addEventListener("input",e=>mOpponentSchool=e.target.value);

  // 結果
  const resBtns={};
  const resRow=div({style:{display:"flex",gap:"8px"}});
  [["win","✅ 勝ち"],["loss","❌ 負け"]].forEach(([v,l])=>{
    const b=btn({className:`sc ${mResult===v?"on":""}`,style:{flex:1,justifyContent:"center"},onClick:()=>{
      mResult=v; Object.keys(resBtns).forEach(k=>resBtns[k].classList.toggle("on",k===v));
    }},[l]);
    resBtns[v]=b; resRow.append(b);
  });

  // スコアモード
  const sModeBtns={};
  const sModeRow=div({style:{display:"flex",gap:"8px"}});
  const scoreWrap=div({style:{display:mScoreMode==="score"?"block":"none"}});
  [["score","セットごとのスコア"],["result","勝ち負けのみ"]].forEach(([v,l])=>{
    const b=btn({className:`sc ${mScoreMode===v?"on":""}`,style:{flex:1,justifyContent:"center"},onClick:()=>{
      mScoreMode=v; Object.keys(sModeBtns).forEach(k=>sModeBtns[k].classList.toggle("on",k===v));
      scoreWrap.style.display=v==="score"?"block":"none";
    }},[l]);
    sModeBtns[v]=b; sModeRow.append(b);
  });

  const buildScoreInputs=()=>{
    scoreWrap.innerHTML="";
    mSets.forEach((set,i)=>{
      const myI=inp({className:"inp",type:"number",placeholder:"自",value:set.my,style:{flex:1}}); myI.addEventListener("input",e=>mSets[i].my=e.target.value);
      const oppI=inp({className:"inp",type:"number",placeholder:"相手",value:set.opp,style:{flex:1}}); oppI.addEventListener("input",e=>mSets[i].opp=e.target.value);
      scoreWrap.append(div({style:{display:"flex",gap:"6px",alignItems:"center",marginBottom:"6px"}},[
        span({style:{fontSize:"11px",color:"var(--muted)",flexShrink:0,width:"52px"}},[`第${i+1}セット`]),
        myI, span({style:{color:"var(--muted)"}},["-"]), oppI,
        i>0?btn({className:"btn btn-d sm",onClick:()=>{mSets.splice(i,1);buildScoreInputs();}},[" × "]):"",
      ]));
    });
    scoreWrap.append(btn({className:"btn btn-g sm",onClick:()=>{mSets.push({my:"",opp:""});buildScoreInputs();}},["＋ セット追加"]));
  };
  buildScoreInputs();

  const noteI=ta({className:"inp",rows:2},mNote); noteI.addEventListener("input",e=>mNote=e.target.value);

  form.append(
    ff("種別",typeRow), tournamentWrap,
    ff("カテゴリ",catRow), ff("対戦日",dateI),
    div({className:"grid2"},[ff("相手の名前・チーム *",oppNameI),ff("相手の学校 *",oppSchoolI)]),
    ff("結果",resRow), ff("スコア入力方法",sModeRow), scoreWrap,
    ff("メモ（任意）",noteI), errEl,
  );

  const submit=async()=>{
    if(!mDate) return showErr(errEl,"対戦日を入力してください");
    if(!mOpponentName.trim()) return showErr(errEl,"相手の名前を入力してください");
    if(!mOpponentSchool.trim()) return showErr(errEl,"相手の学校を入力してください");
    if(mType==="tournament"&&!mTournamentId) return showErr(errEl,"大会を選択してください");
    const scores=mScoreMode==="score"?mSets.filter(s=>s.my||s.opp).map(s=>({my:Number(s.my)||0,opp:Number(s.opp)||0})):[];
    const m={
      id:ex?.id||genId(), studentId:student.id, studentName:student.name,
      type:mType, tournamentId:mType==="tournament"?mTournamentId:"",
      category:mCategory, result:mResult,
      date:mDate, opponentName:mOpponentName.trim(), opponentSchool:mOpponentSchool.trim(),
      scores, note:mNote.trim(), createdAt:ex?.createdAt||new Date().toISOString(),
    };
    await DB.saveMatch(m);
    if(ex){ const i=S.matches.findIndex(x=>x.id===m.id); if(i>=0)S.matches[i]=m; else S.matches.push(m); }
    else S.matches.push(m);
    onSave(m);
  };

  return {form, submit, errEl};
}

// ── Teacher: Settings ───────────────────────────────────────────────────────────
function renderTSettings(root){
  root.innerHTML="";
  const savedEl=div({className:"hidden",style:{color:"var(--green)",fontSize:"13px",marginLeft:"12px"}},["✓ 保存しました"]);
  const showSaved=()=>{ savedEl.className=""; setTimeout(()=>savedEl.className="hidden",2000); };
  const clubI=inp({className:"inp",value:S.cfg.clubName,placeholder:"○○部"}); clubI.addEventListener("input",e=>S.cfg.clubName=e.target.value);
  const grtI=ta({className:"inp",rows:3},S.cfg.greeting); grtI.addEventListener("input",e=>S.cfg.greeting=e.target.value);
  const pwI=inp({className:"inp",type:"password",value:S.cfg.teacherPw}); pwI.addEventListener("input",e=>S.cfg.teacherPw=e.target.value);

  // メール通知セクション
  const emailSection=div({});
  const buildEmailSection=()=>{
    emailSection.innerHTML="";
    const studentsWithEmail=S.students.filter(s=>s.email);
    const studentsNoEmail=S.students.filter(s=>!s.email);

    // メールCSVインポート
    const emailFileI=inp({type:"file",accept:".csv,text/csv",className:"inp"});
    const emailPreview=div({});
    const emailErrEl=div({className:"hidden"});
    let emailParsed=[];

    emailFileI.addEventListener("change",()=>{
      const file=emailFileI.files[0]; if(!file) return;
      const reader=new FileReader();
      reader.onload=ev=>{
        const text=ev.target.result;
        const delim=text.includes("\t")?"\t":",";
        const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
        emailParsed=[];
        const warns=[];
        // ヘッダースキップ（1行目）
        lines.slice(1).forEach((line,i)=>{
          const cols=line.split(delim).map(c=>c.trim().replace(/^"|"$/g,""));
          const email=cols[1]||""; // B列
          const rawName=cols[2]||""; // C列
          if(!email||!rawName) return;
          if(!email.includes("@")){ warns.push(`行${i+2}: メール形式不正`); return; }
          const normName=rawName.replace(/[\s　]/g,"");
          const student=S.students.find(s=>s.name.replace(/[\s　]/g,"")===normName);
          if(!student){ warns.push(`「${rawName}」: 選手が見つかりません`); return; }
          emailParsed.push({student, email});
        });
        emailPreview.innerHTML="";
        if(warns.length) emailPreview.append(div({style:{fontSize:"12px",color:"var(--red)",marginBottom:"8px"}},["⚠ "+warns.slice(0,3).join(" / ")]));
        if(emailParsed.length) emailPreview.append(div({style:{fontSize:"13px",color:"var(--green)",marginBottom:"8px"}},[`✓ ${emailParsed.length}名のメールアドレスを読み込みました`]));
      };
      reader.readAsText(file,"UTF-8");
    });

    // 教員メールアドレス設定
    const teacherEmailI=inp({className:"inp",type:"email",placeholder:"teacher@example.com",value:S.cfg.teacherEmail||""});
    teacherEmailI.addEventListener("input",e=>S.cfg.teacherEmail=e.target.value);

    emailSection.append(div({className:"card",style:{marginBottom:"16px"}},[
      div({style:{fontWeight:700,fontSize:"14px",marginBottom:"16px"}},["📧 メール通知設定"]),
      div({style:{display:"flex",flexDirection:"column",gap:"14px"}},[
        ff("教員メールアドレス（通知受信用）",teacherEmailI),
        div({style:{height:"1px",background:"var(--border)"}}),
        div({style:{fontWeight:600,fontSize:"13px",marginBottom:"-6px"}},["生徒メールアドレス一括登録（フォームCSVから）"]),
        div({style:{fontSize:"12px",color:"var(--muted)"}},[
          "フォームのCSVをそのままアップロード。B列のメールアドレスをC列の名前で照合して登録します。"
        ]),
        ff("CSVファイル（フォームの回答）",emailFileI),
        emailPreview,
        emailErrEl,
        btn({className:"btn btn-g",onClick:async()=>{
          if(!emailParsed.length) return showErr(emailErrEl,"先にCSVを選択してください");
          for(const {student,email} of emailParsed){
            student.email=email;
            await DB.saveStudent(student);
          }
          showSaved(); buildEmailSection();
        }},["メールアドレスを登録"]),
        div({style:{height:"1px",background:"var(--border)"}}),
        div({style:{fontSize:"13px",color:"var(--muted)"}},[
          `登録済み: ${studentsWithEmail.length}名 / 未登録: ${studentsNoEmail.length}名`,
        ]),
        studentsWithEmail.length?div({style:{maxHeight:"160px",overflowY:"auto",border:"1px solid var(--border)",borderRadius:"8px"}},[
          el("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:"12px"}},[
            el("thead",{},[el("tr",{},[el("th",{style:{padding:"6px 10px",textAlign:"left",background:"var(--navy-mid)"}},["氏名"]),el("th",{style:{padding:"6px 10px",textAlign:"left",background:"var(--navy-mid)"}},["メールアドレス"]),el("th",{style:{padding:"6px 10px",background:"var(--navy-mid)"}})])]),
            el("tbody",{},studentsWithEmail.map(s=>el("tr",{},[
              el("td",{style:{padding:"5px 10px",borderTop:"1px solid var(--border)"}},[s.name]),
              el("td",{style:{padding:"5px 10px",borderTop:"1px solid var(--border)",color:"var(--muted)"}},[s.email]),
              el("td",{style:{padding:"5px 10px",borderTop:"1px solid var(--border)"}},[
                btn({className:"btn btn-d sm",style:{padding:"1px 8px",fontSize:"10px"},onClick:async()=>{
                  delete s.email; await DB.saveStudent(s); buildEmailSection();
                }},["削除"]),
              ]),
            ]))),
          ]),
        ]):"",
      ]),
    ]));
  };
  buildEmailSection();

  // ── 指導者管理セクション ──
  const coachSection=div({});
  const buildCoachSection=()=>{
    coachSection.innerHTML="";
    if(!S.cfg.coaches) S.cfg.coaches=[];

    let cName="", cEmail="";

    const cEmailI=inp({className:"inp",type:"email",placeholder:"メールアドレス"}); cEmailI.addEventListener("input",e=>cEmail=e.target.value);
    const cErrEl=div({className:"hidden"});

    // 登録済みリスト
    const coachList=coaches.length ? div({style:{marginTop:"12px",border:"1px solid var(--border)",borderRadius:"8px",overflow:"hidden"}},[
      el("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:"13px"}},[
        el("thead",{},[el("tr",{},[
          el("th",{style:{padding:"7px 12px",background:"var(--navy-mid)",textAlign:"left"}},["名前"]),
          el("th",{style:{padding:"7px 12px",background:"var(--navy-mid)",textAlign:"left"}},["メールアドレス"]),
          el("th",{style:{padding:"7px 12px",background:"var(--navy-mid)"}}),

          el("td",{style:{padding:"7px 12px",borderTop:"1px solid var(--border)",color:"var(--muted)"}},[c.email]),

    coachSection.append(div({className:"card",style:{marginBottom:"16px"}},[
      div({style:{fontWeight:700,fontSize:"14px",marginBottom:"16px"}},["👨‍🏫 指導者管理"]),

  hdr.append(div({style:{fontWeight:900,fontSize:"15px",letterSpacing:"1px",color:"#fff"}},[clubName2]));
  hdr.append(div({style:{width:"1px",height:"20px",background:"rgba(255,255,255,.3)"}}));
  hdr.append(span({style:{fontSize:"11px",color:"rgba(196,154,34,.9)",fontWeight:700,letterSpacing:"1px"}},["PLAYER"]));
  hdr.append(div({style:{marginLeft:"auto",display:"flex",alignItems:"center",gap:"10px"}},[
    div({style:{textAlign:"right"}},[
      div({style:{fontSize:"13px",fontWeight:700,color:"#fff"}},[student.name]),
      div({style:{fontSize:"11px",color:"rgba(255,255,255,.6)"}},[`${student.grade}年${student.cls}組 No.${student.number}`]),
    ]),
    btn({className:"btn",style:{background:"rgba(255,255,255,.15)",color:"#fff",border:"1px solid rgba(255,255,255,.3)",fontSize:"12px",padding:"5px 12px"},onClick:()=>render(renderLogin)},["ログアウト"]),
  ]));
  const content=div({style:{maxWidth:"900px",margin:"0 auto",padding:"clamp(12px,4vw,24px)"}});
  const STABS=[["schedule","📅 スケジュール"],["uniform","📋 配布物"],["matches","🏸 試合記録"],["chat","💬 チャット"],["goal","🎯 目標設定"]];
  let sCurTab="schedule";
  const sTabBar=div({className:"tabs",style:{marginBottom:"24px"}});
  const sTabBtns={};
  const sTabContent=div({});
  const switchSTab=async k=>{
    sCurTab=k; STABS.forEach(([tk])=>sTabBtns[tk].className=`tab ${tk===k?"on":""}`);
    sTabContent.innerHTML="";
    sTabContent.append(div({style:{color:"var(--muted)",fontSize:"13px",padding:"20px 0",textAlign:"center"}},[" 読み込み中..."]));
    try{
      if(k==="schedule"){
        sTabContent.innerHTML=""; renderSchedule(sTabContent);
      } else if(k==="uniform"){
        [S.items,S.resp]=await Promise.all([DB.getItems(),DB.getResps()]);
        sTabContent.innerHTML=""; renderSUniform(sTabContent,student);
      } else if(k==="matches"){
        [S.matches,S.tournaments]=await Promise.all([DB.getMatches(),DB.getTournaments()]);
        sTabContent.innerHTML=""; renderSMatches(sTabContent,student);
      } else if(k==="chat"){
        S.chatRooms=await DB.getChatRooms();
        sTabContent.innerHTML=""; renderChat(sTabContent,student.id,student.name);
        updateChatBadge(sTabBtns["chat"],student.id);
      } else if(k==="goal"){
        sTabContent.innerHTML=""; renderSGoal(sTabContent,student);
      }
    }catch(e){
      console.error("switchSTab error",e);
      sTabContent.innerHTML="";
      sTabContent.append(div({style:{color:"var(--red)",fontSize:"13px",padding:"32px",textAlign:"center"}},[
        `⚠ 読み込みに失敗しました（${e.message}）`,el("br"),
        btn({className:"btn btn-g sm",style:{marginTop:"12px"},onClick:()=>switchSTab(k)},["再読み込み"]),
      ]));
    }
  };

  // 未読バッジ更新関数
  const updateChatBadge=async(tabBtn,uid)=>{
    const marks=await DB.getReadMarks(uid);
    const rooms=await DB.getChatRooms();
    let totalUnread=0;
    // 全体チャット
    const allMsgs=await DB.getChatMessages("all");
    const lastReadAll=marks["all"]||"";
    totalUnread+=allMsgs.filter(m=>m.createdAt>lastReadAll&&m.senderId!==uid).length;
    // 各グループ
    for(const r of rooms){
      const msgs=await DB.getChatMessages(r.id);
      const lastRead=marks[r.id]||"";
      totalUnread+=msgs.filter(m=>m.createdAt>lastRead&&m.senderId!==uid).length;
    }
    if(totalUnread>0){
      tabBtn.innerHTML=`💬 チャット <span style="background:var(--red);color:#fff;border-radius:100px;padding:0 6px;font-size:10px;font-weight:700;margin-left:4px">${totalUnread}</span>`;
    } else {
      tabBtn.textContent="💬 チャット";
    }
  };
  STABS.forEach(([k,l])=>{ const b=btn({className:`tab ${k===sCurTab?"on":""}`,onClick:()=>switchSTab(k)},[l]); sTabBtns[k]=b; sTabBar.append(b); });
  content.append(sTabBar,sTabContent);
  app.append(hdr,content);
  switchSTab("schedule");
  // バッジ更新は画面表示後に非同期で実行（タブ表示を妨げない）
  setTimeout(()=>updateChatBadge(sTabBtns["chat"],student.id),2000);
}

function renderSUniform(root,student){
  root.innerHTML="";
  const gLabel={male:"男性",female:"女性",other:"その他"}[student.gender]||"";
  // 対象フィルター：学年・性別が設定されている場合はその選手のみ表示
  const isTargeted=(item)=>{
    const gradeOk=!item.targetGrades||item.targetGrades.length===0||item.targetGrades.includes(student.grade);
    const genderOk=!item.targetGenders||item.targetGenders.length===0||item.targetGenders.includes(student.gender);
    return gradeOk&&genderOk;
  };
  const pending=S.items.filter(i=>isTargeted(i)&&!getResp(i.id,student.id)&&!isExp(i.deadline));
  const done   =S.items.filter(i=>isTargeted(i)&& getResp(i.id,student.id));
  const expired=S.items.filter(i=>isTargeted(i)&&!getResp(i.id,student.id)&& isExp(i.deadline));
  const rerender=()=>renderStudent();

  if(S.cfg.greeting) root.append(div({style:{marginBottom:"20px",padding:"12px 16px",background:"rgba(74,158,255,.07)",borderRadius:"10px",border:"1px solid rgba(74,158,255,.2)",fontSize:"13px",lineHeight:1.7}},["📢 "+S.cfg.greeting]));
  root.append(div({className:"card fi",style:{marginBottom:"24px",padding:"14px 20px",display:"flex",gap:"16px",alignItems:"center",flexWrap:"wrap"}},[
    div({style:{width:"44px",height:"44px",borderRadius:"50%",background:"var(--accent)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"20px",fontWeight:700,color:"#000",flexShrink:0}},[student.name[0]]),
    div({style:{flex:1}},[
      div({style:{fontWeight:700,fontSize:"15px"}},[student.name,span({style:{fontSize:"12px",color:"var(--muted)",fontWeight:400}},["（"+student.kana+"）"])]),
      div({style:{fontSize:"12px",color:"var(--muted)",marginTop:"2px"}},[`${student.grade}年${student.cls}組 No.${student.number} · ${fmtDs(student.dob)} · ${gLabel}`]),
    ]),
    div({style:{display:"flex",gap:"14px"}},[miniStat("未回答",pending.length,"var(--accent)"),miniStat("回答済",done.length,"var(--green)"),miniStat("期限切",expired.length,"var(--red)")]),
  ]));
  if(pending.length>0){
    root.append(secTitle("⏳ 回答が必要な項目",true));
    pending.forEach(item=>root.append(makeSItemCard(item,student,rerender)));
  }
  if(done.length>0){
    root.append(secTitle("✅ 回答済み",false));
    done.forEach(item=>{
      const r=getResp(item.id,student.id);
      root.append(div({className:"card",style:{display:"flex",gap:"14px",alignItems:"center",marginBottom:"10px"}},[
        thumb(item,44),
        div({style:{flex:1}},[div({style:{fontWeight:600,fontSize:"14px"}},[item.name]),div({style:{fontSize:"12px",color:"var(--muted)"}},[`提出: ${fmtD(r.submittedAt)}`])]),
        div({style:{display:"flex",alignItems:"center",gap:"8px"}},[
          badge("b-g",r.size),
          !isExp(item.deadline)?btn({className:"btn btn-g sm",onClick:()=>openSizeModal(item,student,r,rerender)},["変更"]):"",
        ]),
      ]));
    });
  }
  if(expired.length>0){
    root.append(secTitle("⛔ 締切済（未回答）",false));
    expired.forEach(item=>root.append(div({className:"card",style:{opacity:.6,display:"flex",gap:"14px",alignItems:"center",marginBottom:"10px"}},[
      thumb(item,44),
      div({},[div({style:{fontWeight:600,fontSize:"14px"}},[item.name]),div({style:{fontSize:"12px",color:"var(--red)"}},[`締切: ${fmtD(item.deadline)}`])]),
      badge("b-0","期限切れ"),
    ])));
  }
  if(!S.items.length) root.append(emptyState("🎽","現在、回答が必要な項目はありません"));
}

function renderSMatches(root,student){
  root.innerHTML="";

  // ── レイアウト ──────────────────────────────────────────────────────────
  const leftCol  = div({style:{flex:"1 1 360px",minWidth:0,display:"flex",flexDirection:"column",gap:"12px"}});
  const rightCol = div({style:{flex:"1 1 300px",minWidth:0}});
  root.append(div({style:{display:"flex",gap:"20px",flexWrap:"wrap",alignItems:"flex-start"}},[leftCol,rightCol]));

  // ── 右パネル：履歴 ──────────────────────────────────────────────────────
  const buildHistory=()=>{
    rightCol.innerHTML="";
    const myMs=[...S.matches.filter(m=>m.studentId===student.id)].sort((a,b)=>b.date.localeCompare(a.date));
    const wins=myMs.filter(m=>m.result==="win").length;
    rightCol.append(
      div({style:{fontWeight:700,fontSize:"14px",marginBottom:"10px",paddingBottom:"8px",borderBottom:"1px solid var(--border)"}},[`📋 自分の記録 （${myMs.length}試合）`]),
      div({style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"8px",marginBottom:"12px"}},[
        statCard("試合",myMs.length,"var(--text)"),
        statCard("勝",wins,"var(--green)"),
        statCard("勝率",myMs.length?`${Math.round(wins/myMs.length*100)}%`:"—","var(--accent)"),
      ]),
    );
    if(!myMs.length){ rightCol.append(div({style:{color:"var(--muted)",fontSize:"13px",textAlign:"center",padding:"24px 0"}},["まだ記録がありません"])); return; }
    myMs.forEach(m=>{
      const tn=m.tournamentId?S.tournaments.find(t=>t.id===m.tournamentId)?.name||"大会":"";
      const catL={singles:"シングルス",doubles:"ダブルス",team:"団体戦"}[m.category]||"";
      const scoreText=m.scores?.length?m.scores.map(s=>`${s.my}-${s.opp}`).join(", "):"";
      const row=div({style:{
        padding:"10px 12px",marginBottom:"8px",borderRadius:"8px",fontSize:"12px",
        border:`1px solid ${m.result==="win"?"rgba(46,204,113,.3)":"rgba(232,69,69,.25)"}`,
        background:m.result==="win"?"rgba(46,204,113,.05)":"rgba(232,69,69,.05)",
      }});
      row.append(
        div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"4px"}},[
          div({style:{display:"flex",gap:"5px",flexWrap:"wrap"}},[
            span({style:{color:"var(--muted)"}},[m.date]),
            badge(m.result==="win"?"b-g":"b-r",m.result==="win"?"勝":"負"),
            catL?badge("b-0",catL):"",
          ]),
          btn({className:"btn btn-d sm",style:{padding:"1px 6px",fontSize:"10px"},onClick:async()=>{
            if(!confirm("削除しますか？"))return;
            await DB.deleteMatch(m.id); S.matches=S.matches.filter(x=>x.id!==m.id);
            buildHistory();
          }},["×"]),
        ]),
        div({style:{fontWeight:600}},[`vs ${m.opponentName}`]),
        div({style:{color:"var(--muted)"}},[`${m.opponentSchool}`]),
        m.type==="tournament"&&tn?div({style:{color:"var(--accent)",marginTop:"2px"}},[`🏆 ${tn}`]):"",
        scoreText?div({style:{color:"var(--muted)",marginTop:"2px"}},[`スコア: ${scoreText}`]):"",
        m.note?div({style:{color:"var(--muted)",marginTop:"2px"}},[`📝 ${m.note}`]):"",
      );
      rightCol.append(row);
    });
  };

  // ── 左パネル：入力フォーム ──────────────────────────────────────────────
  const buildForm=()=>{
    leftCol.innerHTML="";
    leftCol.append(div({style:{fontWeight:700,fontSize:"14px",paddingBottom:"8px",borderBottom:"1px solid var(--border)"}},["🏸 試合を記録する"]));

    // ---- 種別 ----
    let mType="practice", mTournamentId="", mCategory="singles", mResult="win";
    let mDate=new Date().toISOString().slice(0,10);
    let mOpponentName="", mOpponentSchool="", mNote="";
    // ライブスコア：各セットをリアルタイム入力
    let mScoreMode="live"; // live | result
    let mSets=[{my:"",opp:""}];

    const errEl=div({className:"hidden"});

    // 種別
    const typeBtns={};
    const typeRow=div({style:{display:"flex",gap:"6px"}});
    const tournWrap=div({className:"hidden"});
    [["practice","🎯 練習試合"],["tournament","🏆 大会"]].forEach(([v,l])=>{
      const b=btn({className:`sc ${mType===v?"on":""}`,style:{flex:1,justifyContent:"center",fontSize:"12px"},onClick:()=>{
        mType=v; Object.keys(typeBtns).forEach(k=>typeBtns[k].classList.toggle("on",k===v));
        tournWrap.className=v==="tournament"?"":"hidden";
      }},[l]);
      typeBtns[v]=b; typeRow.append(b);
    });

    // 大会選択
    const rebuildTournSel=()=>{
      tournWrap.innerHTML="";
      if(!S.tournaments.length){
        tournWrap.append(div({style:{fontSize:"12px",color:"var(--muted)",padding:"8px",background:"var(--navy)",borderRadius:"6px"}},["大会が登録されていません（教員へ依頼）"]));
        return;
      }
      const ts=sel({className:"inp"},[
        opt("","— 大会を選択 —",true),
        ...S.tournaments.sort((a,b)=>b.date.localeCompare(a.date)).map(t=>opt(t.id,`${t.name}${t.date?` (${t.date})`:""}`,false)),
      ]);
      ts.addEventListener("change",e=>mTournamentId=e.target.value);
      tournWrap.append(ts);
    };
    rebuildTournSel();

    // カテゴリ
    const catBtns={};
    const catRow=div({style:{display:"flex",gap:"6px"}});
    [["singles","シングルス"],["doubles","ダブルス"],["team","団体戦"]].forEach(([v,l])=>{
      const b=btn({className:`sc ${mCategory===v?"on":""}`,style:{flex:1,justifyContent:"center",fontSize:"12px"},onClick:()=>{
        mCategory=v; Object.keys(catBtns).forEach(k=>catBtns[k].classList.toggle("on",k===v));
      }},[l]);
      catBtns[v]=b; catRow.append(b);
    });

    // 日付・相手
    const dateI=inp({className:"inp",type:"date",value:mDate}); dateI.addEventListener("input",e=>mDate=e.target.value);
    const oppNameI=inp({className:"inp",placeholder:"相手の名前・チーム名"}); oppNameI.addEventListener("input",e=>mOpponentName=e.target.value);
    const oppSchI=inp({className:"inp",placeholder:"相手の学校名"}); oppSchI.addEventListener("input",e=>mOpponentSchool=e.target.value);

    // 結果
    const resBtns={};
    const resRow=div({style:{display:"flex",gap:"6px"}});
    [["win","✅ 勝ち"],["loss","❌ 負け"]].forEach(([v,l])=>{
      const b=btn({className:`sc ${mResult===v?"on":""}`,style:{flex:1,justifyContent:"center"},onClick:()=>{
        mResult=v; Object.keys(resBtns).forEach(k=>resBtns[k].classList.toggle("on",k===v));
      }},[l]);
      resBtns[v]=b; resRow.append(b);
    });

    // スコアモード切り替え
    const sModeBtns={};
    const sModeRow=div({style:{display:"flex",gap:"6px"}});
    const scoreArea=div({});
    [["live","ライブ入力（試合中）"],["after","事後入力（試合後）"],["none","勝ち負けのみ"]].forEach(([v,l])=>{
      const b=btn({className:`sc ${mScoreMode===v?"on":""}`,style:{flex:1,justifyContent:"center",fontSize:"11px"},onClick:()=>{
        mScoreMode=v; Object.keys(sModeBtns).forEach(k=>sModeBtns[k].classList.toggle("on",k===v));
        buildScoreArea();
      }},[l]);
      sModeBtns[v]=b; sModeRow.append(b);
    });

    const buildScoreArea=()=>{
      scoreArea.innerHTML="";
      if(mScoreMode==="none") return;

      if(mScoreMode==="live"){
        // ライブ：大きなスコアボード
        scoreArea.append(div({style:{background:"var(--navy)",borderRadius:"10px",padding:"16px",marginTop:"4px"}},[ 
          div({style:{textAlign:"center",fontSize:"11px",color:"var(--muted)",marginBottom:"10px"}},["タップで得点を更新"]),
          ...mSets.map((set,i)=>{
            const setLabel=div({style:{textAlign:"center",fontSize:"11px",color:"var(--muted)",marginBottom:"6px"}},[`第${i+1}セット`]);
            const myScore=div({style:{fontSize:"48px",fontWeight:900,color:"var(--green)",fontFamily:"'Bebas Neue',sans-serif",lineHeight:1,userSelect:"none",cursor:"pointer",padding:"4px 0",textAlign:"center"}},[set.my||"0"]);
            const oppScore=div({style:{fontSize:"48px",fontWeight:900,color:"var(--red)",fontFamily:"'Bebas Neue',sans-serif",lineHeight:1,userSelect:"none",cursor:"pointer",padding:"4px 0",textAlign:"center"}},[set.opp||"0"]);
            const myMinus=btn({className:"btn btn-g sm",style:{flex:1,justifyContent:"center"}},["－"]);
            const myPlus =btn({className:"btn btn-p sm",style:{flex:1,justifyContent:"center"}},["＋"]);
            const oppMinus=btn({className:"btn btn-g sm",style:{flex:1,justifyContent:"center"}},["－"]);
            const oppPlus =btn({className:"btn btn-p sm",style:{flex:1,justifyContent:"center",background:"var(--red)",color:"#fff"}},["＋"]);
            myPlus.addEventListener("click",()=>{ mSets[i].my=String(Number(mSets[i].my||0)+1); myScore.textContent=mSets[i].my; });
            myMinus.addEventListener("click",()=>{ mSets[i].my=String(Math.max(0,Number(mSets[i].my||0)-1)); myScore.textContent=mSets[i].my; });
            oppPlus.addEventListener("click",()=>{ mSets[i].opp=String(Number(mSets[i].opp||0)+1); oppScore.textContent=mSets[i].opp; });
            oppMinus.addEventListener("click",()=>{ mSets[i].opp=String(Math.max(0,Number(mSets[i].opp||0)-1)); oppScore.textContent=mSets[i].opp; });
            const scoreBoard=div({style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"8px"}},[
              div({style:{flex:1,textAlign:"center"}},[
                div({style:{fontSize:"11px",color:"var(--green)",marginBottom:"4px",fontWeight:600}},["自分"]),
                myScore,
                div({style:{display:"flex",gap:"4px",marginTop:"6px"}},[myMinus,myPlus]),
              ]),
              div({style:{fontSize:"20px",color:"var(--muted)",fontWeight:700}},["—"]),
              div({style:{flex:1,textAlign:"center"}},[
                div({style:{fontSize:"11px",color:"var(--red)",marginBottom:"4px",fontWeight:600}},["相手"]),
                oppScore,
                div({style:{display:"flex",gap:"4px",marginTop:"6px"}},[oppMinus,oppPlus]),
              ]),
            ]);
            const delBtn=i>0?btn({className:"btn btn-d sm",style:{width:"100%",justifyContent:"center",marginTop:"4px"},onClick:()=>{ mSets.splice(i,1); buildScoreArea(); }},["このセットを削除"]):"";
            return div({style:{marginBottom:"12px",paddingBottom:"12px",borderBottom:i<mSets.length-1?"1px solid var(--border)":""}},[setLabel,scoreBoard,delBtn]);
          }),
          btn({className:"btn btn-g sm",style:{width:"100%",justifyContent:"center",marginTop:"4px"},onClick:()=>{ mSets.push({my:"0",opp:"0"}); buildScoreArea(); }},["＋ セット追加"]),
        ]));
      } else {
        // 事後：テキスト入力
        const wrap=div({style:{display:"flex",flexDirection:"column",gap:"6px",marginTop:"4px"}});
        mSets.forEach((set,i)=>{
          const myI=inp({className:"inp",type:"number",placeholder:"自",value:set.my,style:{flex:1}}); myI.addEventListener("input",e=>mSets[i].my=e.target.value);
          const opI=inp({className:"inp",type:"number",placeholder:"相手",value:set.opp,style:{flex:1}}); opI.addEventListener("input",e=>mSets[i].opp=e.target.value);
          wrap.append(div({style:{display:"flex",gap:"6px",alignItems:"center"}},[
            span({style:{fontSize:"11px",color:"var(--muted)",flexShrink:0,width:"50px"}},[`第${i+1}セット`]),
            myI, span({style:{color:"var(--muted)"}},["-"]), opI,
            i>0?btn({className:"btn btn-d sm",onClick:()=>{ mSets.splice(i,1); buildScoreArea(); }},["×"]):"",
          ]));
        });
        wrap.append(btn({className:"btn btn-g sm",onClick:()=>{ mSets.push({my:"",opp:""}); buildScoreArea(); }},["＋ セット追加"]));
        scoreArea.append(wrap);
      }
    };
    buildScoreArea();

    const noteI=ta({className:"inp",rows:2},""); noteI.addEventListener("input",e=>mNote=e.target.value);

    const submitBtn=btn({className:"btn btn-p",style:{width:"100%",justifyContent:"center",padding:"12px 0",fontSize:"14px"},onClick:async()=>{
      if(!mDate)           return showErr(errEl,"対戦日を入力してください");
      if(!mOpponentName.trim()) return showErr(errEl,"相手の名前を入力してください");
      if(!mOpponentSchool.trim()) return showErr(errEl,"相手の学校を入力してください");
      if(mType==="tournament"&&!mTournamentId) return showErr(errEl,"大会を選択してください");
      // 二重送信防止
      submitBtn.disabled=true; submitBtn.textContent="保存中...";
      try{
        const scores=mScoreMode!=="none"?mSets.filter(s=>s.my!=""||s.opp!="").map(s=>({my:Number(s.my)||0,opp:Number(s.opp)||0})):[];
        const m={
          id:genId(), studentId:student.id, studentName:student.name,
          type:mType, tournamentId:mType==="tournament"?mTournamentId:"",
          category:mCategory, result:mResult,
          date:mDate, opponentName:mOpponentName.trim(), opponentSchool:mOpponentSchool.trim(),
          scores, note:mNote.trim(), createdAt:new Date().toISOString(),
        };
        await DB.saveMatch(m);
        S.matches.push(m);
        buildHistory();
        buildForm(); // フォームリセット
      }catch(e){
        submitBtn.disabled=false; submitBtn.textContent="✅ 記録する";
        showErr(errEl,"保存に失敗しました。再度お試しください。");
      }
    }},["✅ 記録する"]);

    leftCol.append(
      ff("種別",typeRow),
      tournWrap,
      ff("カテゴリ",catRow),
      ff("対戦日",dateI),
      ff("相手の名前・チーム *",oppNameI),
      ff("相手の学校 *",oppSchI),
      ff("結果",resRow),
      ff("スコア入力方式",sModeRow),
      scoreArea,
      ff("メモ（任意）",noteI),
      errEl,
      submitBtn,
    );
  };

  buildForm();
  buildHistory();
}

function makeSItemCard(item,student,onUpdate){
  const urgent=item.deadline&&(new Date(item.deadline)-now())<864e5*2;
  const cdEl=span({className:"cd"},["..."]);

function openSizeModal(item,student,existing,onUpdate){
  let selSize=existing?.size||"";
  const cdEl=span({className:"cd"},["..."]);
  const chips={};
  const sizeGrid=div({className:"sg"});
  item.sizes.forEach(sz=>{
    const b=btn({className:`sc ${selSize===sz?"on":""}`,onClick:()=>{ selSize=sz; item.sizes.forEach(s=>chips[s]?.classList.toggle("on",s===sz)); }},[sz]);
    chips[sz]=b; sizeGrid.append(b);
  });
  const box=div({className:"mb"});
  box.append(
    mhdr("サイズを選択",()=>ov.remove()),
    div({style:{padding:"24px"}},[
      div({style:{display:"flex",gap:"16px",marginBottom:"20px",padding:"16px",background:"var(--navy)",borderRadius:"10px"}},[
        thumb(item,80,36),
        div({},[div({style:{fontWeight:700,fontSize:"15px",marginBottom:"4px"}},[item.name]),item.description?div({style:{color:"var(--muted)",fontSize:"13px",marginBottom:"8px"}},[item.description]):"",div({style:{fontSize:"12px",color:"var(--accent)",fontWeight:700},className:"cd"},[cdEl])]),
      ]),
      div({style:{marginBottom:"10px",fontSize:"13px",fontWeight:600}},["サイズを選んでください"]),
      sizeGrid,
      existing?div({style:{marginTop:"16px",padding:"12px",background:"rgba(46,204,113,.08)",borderRadius:"8px",fontSize:"13px",color:"var(--green)"}},[`✅ 現在の選択: `,el("strong",{},[existing.size]),`（${fmtD(existing.submittedAt)}提出）`]):"",
    ]),
    mftr(()=>ov.remove(),async()=>{
      if(!selSize)return;
      const key=`${item.id}_${student.id}`;

      ov.remove(); onUpdate();
    },existing?"変更して提出":"提出する"),

  const ov=overlay(box,()=>ov.remove());
  startCountdown(cdEl,item.deadline);
}

function renderTAttribute(root){
  root.innerHTML="";
  // 生徒選択 + 診断結果表示エリア
  let selStudentId = S.students.length ? S.students[0].id : null;
  let trialMode = false; // 生徒なしのお試し

  const resultArea = div({});
  const answers = {}; // qN -> Set{"fire","earth","wind"} (複数選択可)

  // 選手セレクト
  const studentSel = sel({className:"inp",style:{maxWidth:"260px"}},[
    opt("__trial","── お試し（保存なし）──", !selStudentId),
    ...S.students.map(s=>opt(s.id,`${s.name}（${s.grade}年${s.cls}組）`,s.id===selStudentId)),
  ]);
  studentSel.addEventListener("change",e=>{
    const v=e.target.value;
    trialMode = v==="__trial";
    selStudentId = trialMode ? null : v;
    Object.keys(answers).forEach(k=>delete answers[k]);
    if(!trialMode){
      const st=S.students.find(s=>s.id===selStudentId);
      if(st?.attrAnswers){
        // 旧形式（文字列）→新形式（配列）変換
        Object.entries(st.attrAnswers).forEach(([k,v])=>{
          answers[k]=new Set(Array.isArray(v)?v:[v]);
        });
      }
    }
    buildDiag();
  });

  // 初期ロード：保存済み回答
  if(selStudentId){
    const st=S.students.find(s=>s.id===selStudentId);
    if(st?.attrAnswers){
      Object.entries(st.attrAnswers).forEach(([k,v])=>{
        answers[k]=new Set(Array.isArray(v)?v:[v]);
      });
    }
  }

  const buildDiag = () => {
    resultArea.innerHTML="";

    // 回答済み件数カウント
    const answeredQ = Object.keys(answers).length;

    // 「診断する」ボタン
    const diagBtn = btn({
      className:"btn btn-p",
      style:{width:"100%",justifyContent:"center",padding:"13px 0",fontSize:"15px",marginBottom:"16px"},
      disabled: answeredQ === 0,
      onClick: () => showResultModal(),
    },[`🔍 診断する（${answeredQ}/9項目）`]);

    // 質問カード群（複数選択対応）
    const qCards = ATTR_QUESTIONS.map(q=>{
      const card=div({style:{background:"var(--card)",border:"1px solid var(--border)",borderRadius:"var(--r)",padding:"16px 20px",marginBottom:"10px"}});
      const answered = answers[q.id]?.size > 0;
      const titleRow=div({style:{fontWeight:700,fontSize:"14px",marginBottom:"4px",color: answered ? "var(--text)" : "var(--accent)",display:"flex",justifyContent:"space-between",alignItems:"center"}},[
        span({},[q.label]),
        answered ? span({style:{fontSize:"11px",color:"var(--green)"}},["✓ 回答済み"]) : span({style:{fontSize:"11px",color:"var(--muted)"}},["未回答"]),
      ]);
      const hint=div({style:{fontSize:"11px",color:"var(--muted)",marginBottom:"10px"}},["複数選択可"]);
      const optRow=div({style:{display:"flex",flexDirection:"column",gap:"8px"}});
      const selSet = answers[q.id] || new Set();

      [["fire",q.fire],["earth",q.earth],["wind",q.wind]].forEach(([attr,text])=>{
        const isOn = selSet.has(attr);
        const row=div({style:{
          display:"flex",alignItems:"flex-start",gap:"12px",padding:"10px 14px",
          borderRadius:"8px",border:`1.5px solid ${isOn?ATTR_COLOR[attr]:"var(--border)"}`,
          background:isOn?`${ATTR_COLOR[attr]}18`:"transparent",
          cursor:"pointer",transition:"all .18s",
        }});
        const chk=div({style:{
          width:"18px",height:"18px",borderRadius:"4px",flexShrink:0,marginTop:"1px",
          border:`2px solid ${ATTR_COLOR[attr]}`,
          background:isOn?ATTR_COLOR[attr]:"transparent",
          transition:"all .18s",display:"flex",alignItems:"center",justifyContent:"center",
          fontSize:"11px",color:"#000",fontWeight:700,
        }},[isOn?"✓":""]);
        const labelEl=div({style:{fontSize:"13px",lineHeight:1.6}},[
          span({style:{fontSize:"11px",fontWeight:700,color:ATTR_COLOR[attr],marginRight:"6px"}},[ATTR_LABEL[attr]]),
          text,
        ]);
        row.append(chk,labelEl);
        row.addEventListener("click",()=>{
          if(!answers[q.id]) answers[q.id]=new Set();
          if(answers[q.id].has(attr)) answers[q.id].delete(attr);
          else answers[q.id].add(attr);
          if(answers[q.id].size===0) delete answers[q.id];
          buildDiag();
        });
        row.addEventListener("mouseenter",()=>{ if(!isOn){ row.style.borderColor=ATTR_COLOR[attr]; row.style.background=`${ATTR_COLOR[attr]}0a`; } });
        row.addEventListener("mouseleave",()=>{ if(!isOn){ row.style.borderColor="var(--border)"; row.style.background="transparent"; } });
        optRow.append(row);
      });
      card.append(titleRow,hint,optRow);
      return card;
    });

    resultArea.append(diagBtn, ...qCards);
  };

  // 結果をモーダルで表示
  const showResultModal = () => {
    // 結果計算
    const counts={fire:0,earth:0,wind:0};
    let totalWeight=0;
    Object.values(answers).forEach(set=>{
      if(!set||set.size===0)return;
      const w=1/set.size;
      set.forEach(attr=>{ counts[attr]+=w; totalWeight+=w; });
    });
    const answeredQ=Object.keys(answers).length;
    const pcts={
      fire:  totalWeight?Math.round(counts.fire/totalWeight*100):0,
      earth: totalWeight?Math.round(counts.earth/totalWeight*100):0,
      wind:  totalWeight?Math.round(counts.wind/totalWeight*100):0,
    };
    const maxCount=Math.max(...Object.values(counts));
    const dominants=totalWeight?Object.entries(counts).filter(([,v])=>v===maxCount).map(([k])=>k):[];

    const icons={fire:"🔥",earth:"🌍",wind:"💨"};
    const box=div({className:"mb",style:{maxWidth:"640px"}});

    // ── ヘッダー ──
    box.append(div({style:{padding:"20px 24px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}},[
      div({style:{fontWeight:700,fontSize:"16px"}},["🔥 属性診断結果"]),
      btn({className:"btn btn-g sm",onClick:()=>ov.remove()},["✕"]),
    ]));

    const body=div({style:{padding:"clamp(16px,4vw,24px)",display:"flex",flexDirection:"column",gap:"16px"}});

    // ── 主属性 ──
    body.append(div({style:{textAlign:"center",padding:"16px 0"}},[
      div({style:{fontSize:"40px",marginBottom:"8px"}},[dominants.map(d=>icons[d]).join(" ")]),
      div({style:{display:"flex",gap:"12px",justifyContent:"center",flexWrap:"wrap"}},[
        ...dominants.map(d=>span({style:{fontSize:"22px",fontWeight:900,color:ATTR_COLOR[d],fontFamily:"'Bebas Neue',sans-serif",letterSpacing:"2px"}},[ATTR_LABEL[d]+" タイプ"]))
      ]),
      div({style:{fontSize:"12px",color:"var(--muted)",marginTop:"8px"}},[`（${answeredQ}/9項目回答済み）`]),
    ]));

    // ── バーグラフ ──
    const bars=div({style:{display:"flex",flexDirection:"column",gap:"10px"}});
    ["fire","earth","wind"].forEach(attr=>{
      const pct=pcts[attr];
      bars.append(div({style:{display:"flex",alignItems:"center",gap:"12px"}},[
        div({style:{width:"52px",fontSize:"12px",fontWeight:700,color:ATTR_COLOR[attr],flexShrink:0}},[ATTR_LABEL[attr]]),
        div({style:{flex:1,height:"10px",background:"var(--navy-light)",borderRadius:"5px",overflow:"hidden"}},[
          div({style:{height:"100%",width:`${pct}%`,background:ATTR_COLOR[attr],borderRadius:"5px",transition:"width .5s ease"}}),
        ]),
        div({style:{width:"40px",textAlign:"right",fontSize:"13px",fontWeight:700,color:ATTR_COLOR[attr]}},[`${pct}%`]),
      ]));
    });
    body.append(bars);

    // ── 組み合わせアドバイス ──
    const mixKey=[...dominants].sort().join("+");
    const mixAdvice=ATTR_MIX_ADVICE[mixKey];
    if(mixAdvice&&dominants.length>1){
      body.append(div({style:{padding:"12px 16px",background:"rgba(255,255,255,0.04)",borderRadius:"8px",border:"1px solid var(--border)",fontSize:"13px",lineHeight:1.7}},[mixAdvice]));
    }

    // ── 属性カード ──
    dominants.forEach(d=>{
      const p=ATTR_PROFILE[d];
      const makeAdviceBlock=(title,items)=>div({style:{marginTop:"12px"}},[
        div({style:{fontSize:"11px",fontWeight:700,color:ATTR_COLOR[d],marginBottom:"6px"}},[title]),
        ...items.map(t=>div({style:{fontSize:"13px",lineHeight:1.7,padding:"7px 10px",background:"var(--navy)",borderRadius:"6px",marginBottom:"4px"}},[t])),
      ]);
      body.append(div({style:{
        background:"var(--card)",border:`1.5px solid ${ATTR_COLOR[d]}40`,
        borderLeft:`4px solid ${ATTR_COLOR[d]}`,borderRadius:"var(--r)",padding:"16px 18px",
      }},[
        div({style:{fontWeight:900,fontSize:"18px",color:ATTR_COLOR[d],fontFamily:"'Bebas Neue',sans-serif",letterSpacing:"2px",marginBottom:"12px"}},[{fire:"🔥 火のヒト",earth:"🌍 土のヒト",wind:"💨 風のヒト"}[d]]),
        ...[["🧬 性質・特徴",p.nature],["⚡ 行動・体の特徴",p.action],["⚠️ 弱点",p.weakness]].map(([t,v])=>
          div({style:{marginBottom:"8px"}},[
            div({style:{fontSize:"11px",fontWeight:700,color:"var(--muted)",marginBottom:"3px"}},[t]),
            div({style:{fontSize:"13px",lineHeight:1.7}},[v]),
          ])
        ),
        makeAdviceBlock("🏸 バドミントンでの活かし方",p.badminton),
        makeAdviceBlock("🎽 部活での役割・立ち回り",p.club),
        makeAdviceBlock("🤝 人間関係・チームメイトとの関わり方",p.relation),
      ]));
    });

    box.append(body);

    // ── フッター：保存ボタン ──
    const st=selStudentId?S.students.find(s=>s.id===selStudentId):null;
    const savedEl=div({className:"hidden",style:{color:"var(--green)",fontSize:"13px"}},[" ✓ 保存しました"]);
    const saveBtn = !trialMode && st
      ? btn({className:"btn btn-p",onClick:async()=>{
          const serialized={};
          Object.entries(answers).forEach(([k,v])=>{ serialized[k]=[...v]; });
          st.attrAnswers=serialized;
          st.attrResult={counts:{fire:Math.round(counts.fire*10)/10,earth:Math.round(counts.earth*10)/10,wind:Math.round(counts.wind*10)/10},pcts,dominants,updatedAt:new Date().toISOString()};
          await DB.saveStudent(st);
          savedEl.className="";
          setTimeout(()=>{ savedEl.className="hidden"; },2500);
        }},["💾 この結果を保存する"])
      : span({style:{fontSize:"12px",color:"var(--muted)"}},["※ お試しモードは保存されません"]);

    box.append(div({style:{padding:"16px 24px",borderTop:"1px solid var(--border)",display:"flex",gap:"10px",justifyContent:"flex-end",alignItems:"center"}},[
      savedEl,
      saveBtn,
      btn({className:"btn btn-g",onClick:()=>ov.remove()},["閉じる"]),
    ]));

    const ov=overlay(box,()=>ov.remove());
  };

  // 既存の診断結果サマリー（生徒一覧）
  const summaryRows=S.students.map(s=>{
    if(!s.attrResult) return null;
    const {dominants,pcts}=s.attrResult;
    const doms=dominants||[];
    const tr=el("tr");
    tr.append(
      el("td",{style:{fontWeight:600}},[s.name]),
      el("td",{style:{color:"var(--muted)"}},[`${s.grade}年${s.cls}組`]),
      el("td",{},[doms.length?div({style:{display:"flex",gap:"4px",flexWrap:"wrap"}},doms.map(d=>span({style:{fontWeight:700,color:ATTR_COLOR[d]}},[ATTR_LABEL[d]]))):badge("b-0","未診断")]),
      el("td",{},[pcts?div({style:{display:"flex",gap:"8px",alignItems:"center"}},[
        ...["fire","earth","wind"].map(a=>span({style:{fontSize:"11px",color:ATTR_COLOR[a]}},[`${ATTR_LABEL[a]}${pcts[a]}%`]))
      ]):"—"]),
    );
    tr.addEventListener("click",()=>{
      studentSel.value=s.id;
      studentSel.dispatchEvent(new Event("change"));
    });
    return tr;
  }).filter(Boolean);

  root.append(
    div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px",flexWrap:"wrap",gap:"12px"}},[
      div({style:{fontSize:"20px",fontWeight:700}},["🔥 属性診断"]),
      div({style:{display:"flex",gap:"10px",alignItems:"center",flexWrap:"wrap"}},[
        label({className:"ff-label",style:{margin:0}},["対象："]),
        studentSel,
      ]),
    ]),

    // 診断済み一覧
    summaryRows.length ? div({style:{marginBottom:"24px"}},[
      div({style:{fontSize:"13px",fontWeight:700,color:"var(--muted)",marginBottom:"10px"}},["診断済み一覧（クリックで再診断）"]),
      div({className:"tw"},[el("table",{},[
        el("thead",{},[el("tr",{},[el("th",{},["氏名"]),el("th",{},["学年/組"]),el("th",{},["主属性"]),el("th",{},["割合"])])]),
        el("tbody",{},summaryRows),
      ])]),
    ]) : "",

    resultArea,
  );

  buildDiag();
}

// ─── CHAT ───────────────────────────────────────────────────────────────────────
async function renderChat(root, userId, userName, isTeacher=false){
  root.innerHTML="";
  root.append(div({style:{color:"var(--muted)",fontSize:"13px",padding:"16px 0",textAlign:"center"}},["読み込み中..."]));
  S.chatRooms=await DB.getChatRooms();
  root.innerHTML="";

  const myRoomsKey=`my_rooms_${userId}`;
  let myRoomIds=new Set(JSON.parse(localStorage.getItem(myRoomsKey)||"[]"));
  const saveMyRooms=()=>localStorage.setItem(myRoomsKey,JSON.stringify([...myRoomIds]));
  const todayVenueKey=`today_venue_${userId}`;
  let todayVenueId=localStorage.getItem(todayVenueKey)||"";

  const fixedRooms=[
    {id:"all",   name:"📢 全体チャット",      sub:"部員・教員全員", fixed:true},
    {id:"staff", name:"👨‍🏫 教員・指導者専用", sub:"教員・指導者のみ", fixed:true, staffOnly:true},
  ];
  const allRooms=[...fixedRooms,...S.chatRooms];
  const visibleRooms=isTeacher?allRooms:allRooms.filter(r=>!r.staffOnly);

  // モバイル判定
  const isMobile=()=>window.innerWidth<=640;

  // ── レイアウト ──
  const hdr=div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}});
  hdr.append(div({style:{fontSize:"18px",fontWeight:700}},["💬 チャット"]));
  if(isTeacher){
    hdr.append(btn({className:"btn btn-p sm",onClick:()=>openChatRoomModal(null,async()=>{
      S.chatRooms=await DB.getChatRooms(); renderChat(root,userId,userName,true);
    })},["＋ グループ作成"]));
  }

  const wrap=div({style:{display:"flex",gap:"16px",alignItems:"flex-start"}});
  const leftCol=div({style:{flex:"0 0 220px",minWidth:0,display:"flex",flexDirection:"column",gap:"4px"}});
  const rightCol=div({style:{flex:"1 1 0",minWidth:0}});
  root.append(hdr,wrap);

  // スマホ：初期は左カラムのみ表示
  const applyLayout=()=>{
    if(isMobile()){
      wrap.style.flexDirection="column";
      leftCol.style.flex="";
      leftCol.style.width="100%";
    } else {
      wrap.style.flexDirection="row";
      leftCol.style.flex="0 0 220px";
      leftCol.style.width="";
    }
  };
  applyLayout();
  window.addEventListener("resize",applyLayout,{once:true});
  wrap.append(leftCol,rightCol);

  let activeRoomId=null;
  const readMarks=await DB.getReadMarks(userId);

  // ── ルーム選択 ──
  const buildRoomList=async()=>{
    leftCol.innerHTML="";
    for(const room of visibleRooms){
      if(room.isVenue) continue;
      const msgs=await DB.getChatMessages(room.id);
      const lastRead=readMarks[room.id]||"";
      const unread=msgs.filter(m=>m.createdAt>lastRead&&m.senderId!==userId).length;
      const isActive=activeRoomId===room.id;

      const card=div({style:{
        padding:"12px 14px",borderRadius:"10px",cursor:"pointer",transition:"all .15s",
        border:`1.5px solid ${isActive?"var(--accent2)":"var(--border)"}`,
        background:isActive?"rgba(46,109,180,.1)":"#fff",
        boxShadow:isActive?"0 2px 8px rgba(46,109,180,.15)":"var(--sh)",
      }});
      const nameRow=div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",gap:"6px"}});
      nameRow.append(
        div({style:{fontWeight:700,fontSize:"14px",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:isActive?"var(--accent2)":"var(--text)"}},[room.name]),
        unread>0?span({style:{background:"var(--red)",color:"#fff",borderRadius:"100px",padding:"2px 7px",fontSize:"11px",fontWeight:700,flexShrink:0}},[String(unread)]):"",
      );
      if(isTeacher&&!room.fixed){
        const btns=div({style:{display:"flex",gap:"3px",flexShrink:0,marginTop:"4px"}});
        if(room.tournamentId){
          btns.append(btn({className:"btn btn-b sm",style:{padding:"2px 8px",fontSize:"11px"},onClick:async e=>{
            e.stopPropagation();
            openVenueModal(room,async()=>{ S.chatRooms=await DB.getChatRooms(); renderChat(root,userId,userName,true); });
          }},["＋会場"]));
        }
        btns.append(btn({className:"btn btn-d sm",style:{padding:"2px 8px",fontSize:"11px"},onClick:async e=>{
          e.stopPropagation();
          if(!confirm(`「${room.name}」を削除しますか？`))return;
          await DB.deleteChatRoom(room.id);
          S.chatRooms=S.chatRooms.filter(r=>r.id!==room.id);
          renderChat(root,userId,userName,true);
        }},["削除"]));
        nameRow.append(btns);
      }
      if(room.sub) card.append(div({style:{fontSize:"12px",color:"var(--muted)",marginTop:"3px"}},[room.sub]));
      if(msgs.length) card.append(div({style:{fontSize:"12px",color:"var(--muted)",marginTop:"4px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},[msgs[msgs.length-1].senderName+": "+msgs[msgs.length-1].text]));
      card.prepend(nameRow);
      card.addEventListener("click",()=>{ activeRoomId=room.id; buildRoomList(); openRoom(room); });
      leftCol.append(card);

      // 会場サブルーム
      if(room.tournamentId){
        const venues=S.chatRooms.filter(r=>r.isVenue&&r.parentRoomId===room.id);
        for(const v of venues){
          const isMine=myRoomIds.has(v.id);
          const isToday=todayVenueId===v.id;
          if(!isMine&&!isTeacher) continue;
          const vMsgs=await DB.getChatMessages(v.id);
          const vLastRead=readMarks[v.id]||"";
          const vUnread=vMsgs.filter(m=>m.createdAt>vLastRead&&m.senderId!==userId).length;
          const vActive=activeRoomId===v.id;
          const vCard=div({style:{
            padding:"10px 12px 10px 20px",borderRadius:"8px",cursor:"pointer",transition:"all .15s",
            border:`1.5px solid ${vActive?"var(--accent2)":isToday?"rgba(26,122,74,.4)":"var(--border)"}`,
            background:vActive?"rgba(46,109,180,.1)":isToday?"rgba(26,122,74,.06)":"#fff",
            marginLeft:"10px",
          }});
          const vNameRow=div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",gap:"6px"}});
          vNameRow.append(
            div({style:{fontWeight:600,fontSize:"13px",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:isToday?"var(--green)":"var(--text)"}},[
              (isToday?"📍 ":"")+v.name
            ]),
            vUnread>0?span({style:{background:"var(--red)",color:"#fff",borderRadius:"100px",padding:"2px 7px",fontSize:"11px",fontWeight:700}},[String(vUnread)]):"",
          );
          if(isTeacher){
            vNameRow.append(btn({className:"btn btn-d sm",style:{padding:"2px 8px",fontSize:"11px"},onClick:async e=>{
              e.stopPropagation();
              if(!confirm(`「${v.name}」を削除しますか？`))return;
              await DB.deleteChatRoom(v.id);
              S.chatRooms=S.chatRooms.filter(r=>r.id!==v.id);
              renderChat(root,userId,userName,true);
            }},["削除"]));
          }
          vCard.append(vNameRow);
          vCard.addEventListener("click",()=>{ activeRoomId=v.id; buildRoomList(); openRoom(v); });
          leftCol.append(vCard);
        }
        if(!isTeacher){
          const allVenues=S.chatRooms.filter(r=>r.isVenue&&r.parentRoomId===room.id);
          if(allVenues.length){
            leftCol.append(btn({className:"btn btn-g sm",style:{marginLeft:"10px",fontSize:"12px",marginBottom:"4px",minHeight:"36px"},onClick:()=>openVenueJoinModal(allVenues,room,async()=>{
              S.chatRooms=await DB.getChatRooms(); buildRoomList();
            })},["📍 会場を選ぶ"]));
          }
        }
      }
    }
  };

  // ── チャット本体 ──
  const openRoom=async(room)=>{
    rightCol.innerHTML="";
    // スマホ：ルームリストを非表示にして右カラムを全幅に
    if(isMobile()){
      leftCol.style.display="none";
      rightCol.style.width="100%";
    }

    const msgs=await DB.getChatMessages(room.id);
    await DB.markRead(userId,room.id);
    readMarks[room.id]=new Date().toISOString();

    const isVenueRoom=room.isVenue;
    const isToday=todayVenueId===room.id;

    // 戻るボタン（スマホのみ表示）
    const backBtn=btn({className:"btn btn-g sm",style:{display:isMobile()?"inline-flex":"none",marginBottom:"10px",gap:"6px"},onClick:()=>{
      rightCol.innerHTML="";
      leftCol.style.display="flex";
      activeRoomId=null;
      buildRoomList();
    }},["← ルーム一覧"]);

    // メッセージエリア：画面高さから動的に
    const msgAreaH=isMobile()?"calc(100svh - 280px)":"420px";
    const msgArea=div({style:{
      height:msgAreaH,minHeight:"240px",overflowY:"auto",display:"flex",flexDirection:"column",gap:"8px",
      padding:"14px",background:"var(--navy-mid)",borderRadius:"12px",marginBottom:"12px",
      border:"1.5px solid var(--border)",
    }});

    const renderMsgs=(messages)=>{
      msgArea.innerHTML="";
      if(!messages.length){
        msgArea.append(div({style:{textAlign:"center",color:"var(--muted)",fontSize:"13px",padding:"40px 0"}},["まだメッセージがありません"]));
        return;
      }
      messages.forEach(m=>{
        const isMe=m.senderId===userId;
        const isTeacherMsg=m.senderId==="__teacher__";
        if(m.isVenueAnnounce){
          msgArea.append(div({style:{textAlign:"center",padding:"8px 16px",margin:"4px 0",background:"rgba(26,122,74,.1)",borderRadius:"8px",border:"1px solid rgba(26,122,74,.3)",fontSize:"13px",color:"var(--green)"}},[`📍 ${m.text}`]));
          return;
        }
        const bubble=div({style:{display:"flex",flexDirection:"column",alignItems:isMe?"flex-end":"flex-start",marginBottom:"4px"}});
        bubble.append(
          div({style:{fontSize:"11px",color:"var(--muted)",marginBottom:"3px",[isMe?"paddingRight":"paddingLeft"]:"6px"}},[isTeacherMsg?"🏫 "+m.senderName:m.senderName]),
          (()=>{
            const b=div({style:{
              maxWidth:isMobile()?"82%":"70%",
              padding:"10px 14px",
              borderRadius:isMe?"14px 4px 14px 14px":"4px 14px 14px 14px",
              background:isMe?"var(--accent2)":isTeacherMsg?"rgba(46,109,180,.15)":"#fff",
              color:isMe?"#fff":"var(--text)",
              fontSize:"14px",lineHeight:1.65,wordBreak:"break-word",
              boxShadow:"0 1px 4px rgba(0,0,0,.08)",
              border:isMe?"none":"1.5px solid var(--border)",
            }},[m.text]);
            if(isMe){
              let pt; b.style.cursor="pointer";
              b.addEventListener("touchstart",()=>{ pt=setTimeout(async()=>{ if(!confirm("削除しますか？"))return; await DB.deleteChatMessage(room.id,m.id); const u=await DB.getChatMessages(room.id); renderMsgs(u); buildRoomList(); },600); },{passive:true});
              b.addEventListener("touchend",()=>clearTimeout(pt));
              b.addEventListener("mousedown",()=>{ pt=setTimeout(async()=>{ if(!confirm("削除しますか？"))return; await DB.deleteChatMessage(room.id,m.id); const u=await DB.getChatMessages(room.id); renderMsgs(u); buildRoomList(); },700); });
              b.addEventListener("mouseup",()=>clearTimeout(pt));
              b.addEventListener("mouseleave",()=>clearTimeout(pt));
            }
            return b;
          })(),
          div({style:{fontSize:"11px",color:"var(--muted)",marginTop:"3px",[isMe?"paddingRight":"paddingLeft"]:"6px"}},[fmtD(m.createdAt)]),
        );
        msgArea.append(bubble);
      });
      msgArea.scrollTop=msgArea.scrollHeight;
    };
    renderMsgs(msgs);

    // 会場設定ボタン
    let venueBar="";
    if(isVenueRoom&&!isTeacher){
      venueBar=btn({
        className:isToday?"btn btn-g":"btn btn-p",
        style:{width:"100%",justifyContent:"center",padding:"12px 0",marginBottom:"10px",fontSize:"14px",
          ...(isToday?{background:"rgba(26,122,74,.1)",color:"var(--green)",border:"1.5px solid rgba(26,122,74,.4)"}:{})},
        onClick:async()=>{
          if(isToday){ todayVenueId=""; localStorage.removeItem(todayVenueKey); }
          else {
            todayVenueId=room.id; localStorage.setItem(todayVenueKey,room.id);
            const announceMsg={id:genId(),roomId:"all",senderId:userId,senderName:userName,
              text:`${userName} が本日の会場を「${room.name}」に設定しました`,isVenueAnnounce:true,createdAt:new Date().toISOString()};
            await DB.sendChatMessage("all",announceMsg);
            try{ await setDoc(doc(db,"notifications",`venue_${userId}`),{text:announceMsg.text,updatedAt:new Date().toISOString(),notified:false}); }catch(_){}
          }
          buildRoomList(); openRoom(room);
        },
      },[isToday?"✅ 本日の会場："+room.name+"（解除する）":"📍 本日の会場をここにする"]);
    }

    // 入力エリア
    const textI=ta({className:"inp",rows:isMobile()?3:2},"");
    textI.placeholder="メッセージを入力...";
    textI.style.resize="none";
    textI.style.fontSize=isMobile()?"15px":"13px";
    let inputText="";
    textI.addEventListener("input",e=>inputText=e.target.value);
    const sendMsg=async()=>{
      const text=inputText.trim(); if(!text)return;
      const msg={id:genId(),roomId:room.id,senderId:userId,senderName:userName,text,createdAt:new Date().toISOString()};
      await DB.sendChatMessage(room.id,msg);
      textI.value=""; inputText="";
      const updated=await DB.getChatMessages(room.id); renderMsgs(updated); buildRoomList();
    };
    textI.addEventListener("keydown",async e=>{ if(e.key==="Enter"&&!e.shiftKey&&!isMobile()){ e.preventDefault(); await sendMsg(); } });

    const sendBtn=btn({className:"btn btn-p",style:{alignSelf:"flex-end",padding:"12px 20px",fontSize:"15px",minHeight:"48px",flexShrink:0},onClick:sendMsg},["送信"]);

    rightCol.append(
      backBtn,
      div({style:{fontWeight:700,fontSize:"15px",marginBottom:"10px",paddingBottom:"8px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:"8px",color:"var(--accent2)"}},[
        room.name,
        isVenueRoom&&isToday?span({style:{fontSize:"11px",color:"var(--green)",fontWeight:700}},["📍 本日の会場"]):"",
      ]),
      venueBar||"",
      msgArea,
      div({style:{display:"flex",gap:"10px",alignItems:"flex-end"}},[
        div({style:{flex:1}},[textI]),
        sendBtn,
      ]),
    );
  };

  await buildRoomList();
  // PC：最初のルームを自動で開く（スマホはルームリストを先に表示）
  if(!isMobile()&&visibleRooms.filter(r=>!r.isVenue).length){
    const first=visibleRooms.find(r=>!r.isVenue);
    activeRoomId=first.id; buildRoomList(); openRoom(first);
  }
}

async function renderTManage(root){
  root.innerHTML="";
