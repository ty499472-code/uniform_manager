<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>清教学園バドミントン部 ユニフォーム管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0D1B2A;--navy-mid:#1B2B3A;--navy-light:#243447;
  --accent:#F4A228;--red:#E84545;--green:#2ECC71;--blue:#4A9EFF;
  --text:#E8EDF2;--muted:#8A9BAD;
  --border:rgba(255,255,255,0.08);--card:rgba(255,255,255,0.04);
  --card-h:rgba(255,255,255,0.07);--r:12px;--sh:0 8px 32px rgba(0,0,0,0.4);
}
body{font-family:'Noto Sans JP',sans-serif;background:var(--navy);color:var(--text);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--navy)}
::-webkit-scrollbar-thumb{background:var(--navy-light);border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.fi{animation:fadeIn .35s ease both}.si{animation:slideIn .3s ease both}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:8px;border:none;
  font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-p{background:var(--accent);color:#000;font-weight:700}
.btn-p:hover{background:#fbb440;transform:translateY(-1px);box-shadow:0 4px 16px rgba(244,162,40,.4)}
.btn-g{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-g:hover{background:var(--card-h)}
.btn-d{background:rgba(232,69,69,.15);color:var(--red);border:1px solid rgba(232,69,69,.3)}
.btn-d:hover{background:rgba(232,69,69,.25)}
.btn-b{background:rgba(74,158,255,.12);color:var(--blue);border:1px solid rgba(74,158,255,.25)}
.btn-b:hover{background:rgba(74,158,255,.2)}
.sm{padding:5px 12px!important;font-size:12px!important}
button:disabled{opacity:.4;cursor:not-allowed;transform:none!important;pointer-events:none}
.inp{width:100%;padding:9px 13px;background:var(--navy-mid);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}.inp::placeholder{color:var(--muted)}
select.inp{appearance:none;cursor:pointer}
textarea.inp{resize:vertical}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:600}
.b-g{background:rgba(46,204,113,.15);color:var(--green)}
.b-r{background:rgba(232,69,69,.15);color:var(--red)}
.b-y{background:rgba(244,162,40,.15);color:var(--accent)}
.b-0{background:rgba(255,255,255,.08);color:var(--muted)}
.b-b{background:rgba(74,158,255,.15);color:var(--blue)}
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--navy-mid);padding:10px 14px;text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
td{padding:11px 14px;border-top:1px solid var(--border)}
tr:hover td{background:var(--card-h)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.mb{background:var(--navy-mid);border:1px solid var(--border);border-radius:16px;max-width:540px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--sh);animation:fadeIn .22s ease}
.tabs{display:flex;gap:4px;background:var(--navy-mid);border-radius:10px;padding:4px}
.tab{flex:1;padding:8px 16px;border-radius:7px;border:none;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;background:transparent;color:var(--muted)}
.tab.on{background:var(--accent);color:#000;font-weight:700}
.tab:not(.on):hover{background:var(--card);color:var(--text)}
.pb{height:6px;background:var(--navy-light);border-radius:3px;overflow:hidden}
.pf{height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease}
.cd{font-variant-numeric:tabular-nums}
.uz{border:2px dashed var(--border);border-radius:var(--r);padding:32px;text-align:center;cursor:pointer;transition:all .2s}
.uz:hover,.uz.dg{border-color:var(--accent);background:rgba(244,162,40,.05)}
.sg{display:flex;flex-wrap:wrap;gap:8px}
.sc{padding:7px 16px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);
  font-size:13px;font-weight:600;cursor:pointer;transition:all .18s;font-family:inherit;color:var(--text)}
.sc:hover{border-color:var(--accent);color:var(--accent)}
.sc.on{border-color:var(--accent);background:rgba(244,162,40,.15);color:var(--accent)}
.sd{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.sd-d{background:var(--green);color:#000}.sd-a{background:var(--accent);color:#000}.sd-p{background:var(--navy-light);color:var(--muted)}
.sp{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
.hidden{display:none!important}
.ff-label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;font-weight:600}
.err-box{color:var(--red);font-size:12px;padding:8px 12px;background:rgba(232,69,69,.08);border-radius:6px;border:1px solid rgba(232,69,69,.2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
@media(max-width:640px){
  .grid2,.grid3{grid-template-columns:1fr!important}
  .tabs .tab{font-size:11px;padding:7px 8px}
}
</style>
</head>
<body>
<div id="app">
  <div class="loading-screen">
    <div class="sp"></div>
    <div style="color:var(--muted);font-size:13px">読み込み中...</div>
  </div>
</div>

<script type="module">
// ─── Firebase ──────────────────────────────────────────────────────────────────
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, collection,
  getDocs, deleteDoc, onSnapshot, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6TbrWqu2CAzggiCqzcvr06mwnDOdEZk4",
  authDomain: "seikyobadomintonmanager.firebaseapp.com",
  projectId: "seikyobadomintonmanager",
  storageBucket: "seikyobadomintonmanager.firebasestorage.app",
  messagingSenderId: "86245954924",
  appId: "1:86245954924:web:2eed89af19e5af4afb4f49"
};
const firebase = initializeApp(firebaseConfig);
const db = getFirestore(firebase);

// ─── DB helpers ────────────────────────────────────────────────────────────────
const DEF_CFG = { clubName:"清教学園バドミントン部", teacherPw:"teacher123", greeting:"" };

const DB = {
  async getCfg(){
    try{ const d=await getDoc(doc(db,"app","cfg")); return d.exists()?d.data():DEF_CFG; }catch{ return DEF_CFG; }
  },
  async saveCfg(cfg){ await setDoc(doc(db,"app","cfg"),cfg); },
  async getStudents(){
    try{ const s=await getDocs(collection(db,"students")); return s.docs.map(d=>({id:d.id,...d.data()})); }catch{ return []; }
  },
  async saveStudent(s){ await setDoc(doc(db,"students",s.id),s); },
  async deleteStudent(id){ await deleteDoc(doc(db,"students",id)); },
  async getItems(){
    try{ const s=await getDocs(collection(db,"items")); return s.docs.map(d=>({id:d.id,...d.data()})); }catch{ return []; }
  },
  async saveItem(item){ await setDoc(doc(db,"items",item.id),item); },
  async deleteItem(id){ await deleteDoc(doc(db,"items",id)); },
  async getResps(){
    try{ const s=await getDocs(collection(db,"responses")); const r={}; s.docs.forEach(d=>r[d.id]=d.data()); return r; }catch{ return {}; }
  },
  async saveResp(key,data){ await setDoc(doc(db,"responses",key),data); },
  async getMatches(){
    try{ const s=await getDocs(collection(db,"matches")); return s.docs.map(d=>({id:d.id,...d.data()})); }catch{ return []; }
  },
  async saveMatch(m){ await setDoc(doc(db,"matches",m.id),m); },
  async deleteMatch(id){ await deleteDoc(doc(db,"matches",id)); },
};

// ─── Utils ─────────────────────────────────────────────────────────────────────
const genId = () => Math.random().toString(36).slice(2,9);
const CLS_OPTS = ["A","B","C","D","E","F","G","H","I","J","K","L"];
const now   = () => new Date();
const fmtD  = d => d ? new Date(d).toLocaleString("ja-JP",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—";
const fmtDs = d => d ? new Date(d).toLocaleDateString("ja-JP") : "—";
const isExp = d => d && new Date(d) < now();
const hp    = s => btoa(encodeURIComponent(s+"uf2024"));

// ─── App State ─────────────────────────────────────────────────────────────────
const S = { cfg:DEF_CFG, students:[], items:[], resp:{}, matches:[], role:null, sid:null };

async function loadAll(){
  const [cfg, students, items, resp, matches] = await Promise.all([
    DB.getCfg(), DB.getStudents(), DB.getItems(), DB.getResps(), DB.getMatches()
  ]);
  S.cfg=cfg; S.students=students; S.items=items; S.resp=resp; S.matches=matches;
}

const findStudent = (grade,cls,number) =>
  S.students.find(s=>s.grade===grade&&s.cls===cls&&String(s.number)===String(number))||null;

const getResp     = (iid,sid) => S.resp[`${iid}_${sid}`]||null;
const getItemResp = (iid)     => {
  const r={};
  S.students.forEach(s=>{ const x=S.resp[`${iid}_${s.id}`]; if(x)r[s.id]=x; });
  return r;
};

// ─── Countdown timers ──────────────────────────────────────────────────────────
const cdTimers = {};
function startCountdown(el, deadline){
  if(!el||!deadline) return;
  const id = el.dataset.cdId || (el.dataset.cdId = genId());
  if(cdTimers[id]) clearInterval(cdTimers[id]);
  const tick = () => {
    const diff = new Date(deadline) - now();
    if(diff<=0){ el.textContent="締切済"; clearInterval(cdTimers[id]); return; }
    const d=Math.floor(diff/864e5),h=Math.floor((diff%864e5)/36e5),
          m=Math.floor((diff%36e5)/6e4),s=Math.floor((diff%6e4)/1e3);
    el.textContent = d>0?`残り${d}日${h}時間`:`残り${h}時間${m}分${s}秒`;
  };
  tick(); cdTimers[id]=setInterval(tick,1000);
}
function clearAllCountdowns(){ Object.values(cdTimers).forEach(clearInterval); Object.keys(cdTimers).forEach(k=>delete cdTimers[k]); }

// ─── Render engine ─────────────────────────────────────────────────────────────
const app = document.getElementById("app");
function render(fn){ clearAllCountdowns(); app.innerHTML=""; fn(); }
function showLoading(msg="処理中..."){
  app.innerHTML=`<div class="loading-screen"><div class="sp"></div><div style="color:var(--muted);font-size:13px">${msg}</div></div>`;
}

// ─── DOM helpers ───────────────────────────────────────────────────────────────
function el(tag,props={},children=[]){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(k==="className") e.className=v;
    else if(k.startsWith("on")&&typeof v==="function") e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="style"&&typeof v==="object") Object.assign(e.style,v);
    else if(k==="disabled") e.disabled=!!v;
    else e.setAttribute(k,v);
  }
  for(const c of children){ if(c==null||c===false)continue; e.append(typeof c==="string"||typeof c==="number"?String(c):c); }
  return e;
}
const div  = (p,c)=>el("div",p,c);
const btn  = (p,c)=>el("button",p,c);
const inp  = (p)  =>el("input",p);
const sel  = (p,c)=>el("select",p,c);
const opt  = (v,t,s)=>{ const o=el("option",{value:v},[t]); if(s)o.selected=true; return o; };
const span = (p,c)=>el("span",p,c);
const label= (p,c)=>el("label",p,c);
const ta   = (p,t)=>{ const e=el("textarea",p); e.value=t||""; return e; };

function ff(labelText, child){ return div({},[label({className:"ff-label"},[labelText]),child]); }
function badge(cls,text){ return span({className:`badge ${cls}`},[text]); }
function showErr(el,msg){ el.className="err-box"; el.textContent=`⚠ ${msg}`; }
function mhdr(title,onClose){
  return div({style:{padding:"18px 24px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}},[
    div({style:{fontWeight:700,fontSize:16}},[title]),
    btn({className:"btn btn-g sm",onClick:onClose},["✕"]),
  ]);
}
function mftr(onClose,onSave,saveLabel="保存",disabled=false){
  return div({style:{padding:"14px 24px",borderTop:"1px solid var(--border)",display:"flex",gap:8,justifyContent:"flex-end"}},[
    btn({className:"btn btn-g",onClick:onClose},["キャンセル"]),
    btn({className:"btn btn-p",onClick:onSave,disabled},[saveLabel]),
  ]);
}
function thumb(item,size=54,fs=22){
  const w=div({style:{width:size+"px",height:size+"px",borderRadius:"8px",background:"var(--navy-light)",flexShrink:0,overflow:"hidden",display:"flex",alignItems:"center",justifyContent:"center",fontSize:fs+"px"}});
  if(item.imageUrl){ w.append(el("img",{src:item.imageUrl,style:{width:"100%",height:"100%",objectFit:"cover"}})); }
  else w.textContent="👕";
  return w;
}
function stepBar(steps,current){
  const row=div({style:{display:"flex",alignItems:"center"}});
  steps.forEach((lbl,i)=>{
    const dot=div({className:`sd ${current>i+1?"sd-d":current===i+1?"sd-a":"sd-p"}`},[current>i+1?"✓":String(i+1)]);
    const lt=div({style:{fontSize:10,color:current===i+1?"var(--accent)":"var(--muted)",whiteSpace:"nowrap"}},[lbl]);
    row.append(div({style:{display:"flex",flexDirection:"column",alignItems:"center",gap:"4px"}},[dot,lt]));
    if(i<steps.length-1) row.append(div({style:{flex:1,height:"2px",background:current>i+1?"var(--green)":"var(--navy-light)",margin:"0 6px",marginBottom:"16px"}}));
  });
  return row;
}
function overlay(content,onBg){
  const ov=div({className:"ov"});
  ov.addEventListener("click",e=>{ if(e.target===ov)onBg(); });
  ov.append(content); document.body.append(ov); return ov;
}
function emptyState(icon,text){
  return div({style:{textAlign:"center",padding:"56px 24px",color:"var(--muted)"}},[
    div({style:{fontSize:"48px",marginBottom:"12px"}},[icon]),
    div({style:{fontSize:"14px"}},[text]),
  ]);
}
function miniStat(label,value,color){
  return div({style:{textAlign:"center"}},[
    div({style:{fontSize:"22px",fontWeight:900,color,fontFamily:"'Bebas Neue',sans-serif",lineHeight:1}},[String(value)]),
    div({style:{fontSize:"10px",color:"var(--muted)",marginTop:"2px"}},[label]),
  ]);
}
function secTitle(text,accent){
  return div({style:{fontSize:"14px",fontWeight:700,color:accent?"var(--accent)":"var(--muted)",marginBottom:"14px",marginTop:"4px"}},[text]);
}

// ─── LOGIN ─────────────────────────────────────────────────────────────────────
function renderLogin(){
  const name=S.cfg.clubName||"部活";
  const wrap=div({style:{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px",background:"radial-gradient(ellipse at 30% 20%,#1a2d45,#0D1B2A 65%)"}});
  const logo=div({style:{marginBottom:"36px",textAlign:"center"}},[
    div({style:{fontFamily:"'Bebas Neue',sans-serif",fontSize:"48px",letterSpacing:"4px",color:"var(--accent)",lineHeight:1}},["UNIFORM"]),
    div({style:{fontFamily:"'Bebas Neue',sans-serif",fontSize:"48px",letterSpacing:"4px",color:"var(--text)",lineHeight:1}},["MANAGER"]),
    div({style:{color:"var(--muted)",fontSize:"13px",marginTop:"8px"}},[`${name} ユニフォーム管理システム`]),
  ]);
  const makeCard=(icon,title,sub,onClick)=>{
    const c=div({style:{width:"155px",padding:"26px 18px",borderRadius:"16px",border:"1.5px solid var(--border)",background:"var(--card)",cursor:"pointer",textAlign:"center",transition:"all .2s"}},[
      div({style:{fontSize:"38px",marginBottom:"10px"}},[icon]),
      div({style:{fontWeight:700,fontSize:"17px",marginBottom:"4px"}},[title]),
      div({style:{fontSize:"12px",color:"var(--muted)"}},[sub]),
    ]);
    c.addEventListener("click",onClick);
    c.addEventListener("mouseenter",()=>{c.style.borderColor="var(--accent)";c.style.transform="translateY(-4px)";c.style.boxShadow="0 12px 32px rgba(244,162,40,.15)";});
    c.addEventListener("mouseleave",()=>{c.style.borderColor="";c.style.transform="";c.style.boxShadow="";});
    return c;
  };
  const cards=div({className:"fi",style:{display:"flex",gap:"16px",flexWrap:"wrap",justifyContent:"center"}},[
    makeCard("🏫","教員","管理者ログイン",()=>renderTeacherLogin()),
    makeCard("👕","生徒","生徒ログイン",  ()=>renderStudentRouter()),
  ]);
  wrap.append(logo,cards);
  app.append(wrap);
}

// ─── TEACHER LOGIN ──────────────────────────────────────────────────────────────
function renderTeacherLogin(){
  render(()=>{
    const wrap=div({style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",background:"radial-gradient(ellipse at 30% 20%,#1a2d45,#0D1B2A 65%)"}});
    const errEl=div({className:"hidden"});
    const pwI=inp({className:"inp",type:"password",placeholder:"パスワードを入力"});
    const go=()=>{ if(pwI.value===S.cfg.teacherPw){ S.role="teacher"; render(renderTeacher); } else showErr(errEl,"パスワードが違います"); };
    pwI.addEventListener("keydown",e=>e.key==="Enter"&&go());
    const card=div({className:"card fi",style:{maxWidth:"340px",width:"100%",padding:"28px"}},[
      div({style:{fontWeight:700,fontSize:"16px",marginBottom:"18px"}},["🏫 教員ログイン"]),
      ff("パスワード",div({},[pwI,div({style:{fontSize:"11px",color:"var(--muted)",marginTop:"4px"}},["デモ: teacher123"])])),
      errEl,
      btn({className:"btn btn-p",style:{width:"100%",marginTop:"12px",justifyContent:"center"},onClick:go},["ログイン"]),
      btn({className:"btn btn-g",style:{width:"100%",marginTop:"8px",justifyContent:"center"},onClick:()=>render(renderLogin)},["← 戻る"]),
    ]);
    wrap.append(card); app.append(wrap);
  });
}

// ─── STUDENT ROUTER ─────────────────────────────────────────────────────────────
function renderStudentRouter(){
  render(()=>{
    const wrap=div({style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",background:"radial-gradient(ellipse at 30% 20%,#1a2d45,#0D1B2A 65%)"}});
    const card=div({className:"card fi",style:{maxWidth:"400px",width:"100%",padding:"28px"}},[
      div({style:{fontWeight:700,fontSize:"16px",marginBottom:"6px"}},["👕 生徒ログイン"]),
      div({style:{color:"var(--muted)",fontSize:"13px",marginBottom:"20px"}},["はじめての方は「新規登録」、登録済みの方は「ログイン」へ。"]),
      div({style:{display:"flex",flexDirection:"column",gap:"10px"}},[
        btn({className:"btn btn-p",style:{width:"100%",justifyContent:"center",padding:"13px 0",fontSize:"14px"},onClick:renderStudentReg},["✨ 新規登録（はじめての方）"]),
        btn({className:"btn btn-g",style:{width:"100%",justifyContent:"center",padding:"13px 0",fontSize:"14px"},onClick:renderStudentLogin},["🔑 ログイン（登録済みの方）"]),
      ]),
      btn({className:"btn btn-g sm",style:{marginTop:"16px",width:"100%",justifyContent:"center"},onClick:()=>render(renderLogin)},["← 戻る"]),
    ]);
    wrap.append(card); app.append(wrap);
  });
}

// ─── STUDENT REGISTRATION ───────────────────────────────────────────────────────
function renderStudentReg(){
  render(()=>{
    const wrap=div({style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",background:"radial-gradient(ellipse at 30% 20%,#1a2d45,#0D1B2A 65%)"}});
    const card=div({style:{maxWidth:"480px",width:"100%",background:"var(--card)",border:"1px solid var(--border)",borderRadius:"var(--r)",overflow:"hidden"}});
    let step=1, pw="", pw2="";
    const form={name:"",kana:"",dob:"",gender:"",grade:"",cls:"",number:""};
    const hdr=div({style:{padding:"18px 24px",background:"var(--navy)",borderBottom:"1px solid var(--border)"}});
    const body=div({style:{padding:"24px"}});
    const ftr=div({style:{padding:"16px 24px",borderTop:"1px solid var(--border)",display:"flex",gap:"8px"}});
    card.append(hdr,body,ftr);

    const rebuildHdr=()=>{ hdr.innerHTML=""; hdr.append(div({style:{fontWeight:700,fontSize:"15px",marginBottom:"14px"}},["✨ 新規登録"]),stepBar(["プロフィール入力","パスワード設定"],step)); };

    let genderVal="";
    const buildStep1=()=>{
      body.innerHTML=""; const errEl=div({className:"hidden"});
      const nameI=inp({className:"inp",placeholder:"田中 花子",value:form.name}); nameI.addEventListener("input",e=>form.name=e.target.value);
      const kanaI=inp({className:"inp",placeholder:"たなか はなこ",value:form.kana}); kanaI.addEventListener("input",e=>form.kana=e.target.value);

          if(!form.grade)         return showErr(errEl,"学年を選択してください");
          if(!form.cls)           return showErr(errEl,"クラスを選択してください");
          if(!form.number.trim()) return showErr(errEl,"出席番号を入力してください");

          if(dup&&dup.registered) return showErr(errEl,"この学年・クラス・出席番号はすでに登録済みです。「ログイン」をお使いください。");

        }},["次へ →"]),
      );
    };

    const buildStep2=()=>{
      body.innerHTML=""; const errEl=div({className:"hidden"});
      const pwI=inp({className:"inp",type:"password",placeholder:"••••••••"}); pwI.addEventListener("input",e=>pw=e.target.value);
      const pw2I=inp({className:"inp",type:"password",placeholder:"••••••••"}); pw2I.addEventListener("input",e=>pw2=e.target.value);
      body.append(div({style:{display:"flex",flexDirection:"column",gap:"14px"}},[
        div({style:{padding:"14px",background:"rgba(46,204,113,.07)",borderRadius:"8px",border:"1px solid rgba(46,204,113,.2)"}},[
          div({style:{fontWeight:700,fontSize:"14px"}},[form.name]),
          div({style:{fontSize:"12px",color:"var(--muted)",marginTop:"2px"}},[`${form.kana} · ${form.grade}年${form.cls}組 · No.${form.number}`]),
        ]),
        ff("パスワード（6文字以上）*",pwI),
        ff("パスワード（確認）*",pw2I),
        errEl,
      ]));
      pw2I.addEventListener("keydown",e=>{ if(e.key==="Enter") doFinish(errEl); });
      ftr.innerHTML="";
      ftr.append(
        btn({className:"btn btn-g",onClick:()=>{ step=1; rebuildHdr(); buildStep1(); }},["← 戻る"]),
        div({style:{flex:1}}),
        btn({className:"btn btn-p",onClick:()=>doFinish(errEl)},["登録してログイン ✓"]),
      );
    };

    const doFinish=async(errEl)=>{
      if(pw.length<6)  return showErr(errEl,"パスワードは6文字以上で設定してください");
      if(pw!==pw2)     return showErr(errEl,"パスワードが一致しません");
      showLoading("登録中...");
      try{
        const existing=findStudent(form.grade,form.cls,form.number.trim());
        let id;
        if(existing){
          id=existing.id;
          const updated={...existing,...form,number:String(form.number.trim()),passwordHash:hp(pw),registered:true};
          await DB.saveStudent(updated);
          const idx=S.students.findIndex(s=>s.id===id);
          if(idx>=0) S.students[idx]=updated; else S.students.push(updated);
        } else {
          id=genId();
          const newS={...form,id,number:String(form.number.trim()),passwordHash:hp(pw),registered:true};
          await DB.saveStudent(newS);
          S.students.push(newS);
        }
        S.role="student"; S.sid=id;
        render(renderStudent);
      }catch(e){ render(()=>{ renderStudentReg(); showErr(errEl,"登録に失敗しました: "+e.message); }); }
    };

    rebuildHdr(); buildStep1();
    wrap.append(card); app.append(wrap);
  });
}

  const total=S.students.length;
  const pct=total?Math.round(done/total*100):0;
  const detailRow=div({className:"hidden si",style:{marginTop:"16px",paddingTop:"16px",borderTop:"1px solid var(--border)"}});

        span({},[cdEl]),span({},[`📅 ${fmtD(item.deadline)}`]),span({},[`✅ ${done}/${total}名`]),
      ]),
      div({style:{marginTop:"8px"}},[div({className:"pb"},[div({className:"pf",style:{width:`${pct}%`}})])]),
    ]),
    div({style:{display:"flex",gap:"6px",flexShrink:0}},[
      btn({className:"btn btn-g sm",onClick:e=>{e.stopPropagation();openItemModal(item,onUpdate);}},["編集"]),

function openItemModal(item,onSave){
  const isE=!!item;
  let name=item?.name||"",desc=item?.description||"",sizesStr=item?.sizes?.join(", ")||"XS, S, M, L, XL, XXL";
  let dlVal=item?.deadline?item.deadline.slice(0,16):"",required=item?.required??false,imageUrl=item?.imageUrl||null;
  const box=div({className:"mb"}); const errEl=div({className:"hidden"});
  const imgPrev=div({style:{minHeight:"80px",display:"flex",alignItems:"center",justifyContent:"center"}});
  const fileI=inp({type:"file",accept:"image/*",style:{display:"none"}});
  const uzDiv=div({className:"uz"},[imgPrev,fileI]);
  const rebPrev=()=>{
    imgPrev.innerHTML="";
    if(imageUrl){ imgPrev.append(el("img",{src:imageUrl,style:{maxHeight:"130px",maxWidth:"100%",borderRadius:"8px"}})); }
    else imgPrev.innerHTML=`<div style="color:var(--muted)"><div style="font-size:28px;margin-bottom:8px">📷</div><div style="font-size:13px">クリック or ドラッグで画像アップロード</div></div>`;
  };
  rebPrev();
  uzDiv.addEventListener("click",()=>fileI.click());
  fileI.addEventListener("change",e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=ev=>{imageUrl=ev.target.result;rebPrev();}; r.readAsDataURL(f); });
  uzDiv.addEventListener("dragover",e=>{e.preventDefault();uzDiv.classList.add("dg");});
  uzDiv.addEventListener("dragleave",()=>uzDiv.classList.remove("dg"));
  uzDiv.addEventListener("drop",e=>{e.preventDefault();uzDiv.classList.remove("dg");const f=e.dataTransfer.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{imageUrl=ev.target.result;rebPrev();};r.readAsDataURL(f);});
  const delBtn=btn({className:"btn btn-g sm",style:{marginTop:"8px",display:imageUrl?"inline-flex":"none"},onClick:()=>{imageUrl=null;rebPrev();delBtn.style.display="none";}},["画像を削除"]);
  const nameI=inp({className:"inp",value:name,placeholder:"ゲームシャツ（半袖）"}); nameI.addEventListener("input",e=>name=e.target.value);
  const descI=ta({className:"inp",rows:2},desc); descI.addEventListener("input",e=>desc=e.target.value);
  const sizI=inp({className:"inp",value:sizesStr}); sizI.addEventListener("input",e=>sizesStr=e.target.value);
  const dlI=inp({className:"inp",type:"datetime-local",value:dlVal}); dlI.addEventListener("input",e=>dlVal=e.target.value);
  const reqChk=inp({type:"checkbox",checked:required,style:{width:"16px",height:"16px",accentColor:"var(--accent)"}}); reqChk.addEventListener("change",e=>required=e.target.checked);
  box.append(
    mhdr(isE?"項目を編集":"新規項目を追加",()=>ov.remove()),
    div({style:{padding:"24px",display:"flex",flexDirection:"column",gap:"16px"}},[
      ff("見本画像",div({},[uzDiv,delBtn])),
      ff("項目名 *",nameI),ff("説明",descI),ff("サイズ選択肢（カンマ区切り）*",sizI),ff("締切日時 *",dlI),
      label({style:{display:"flex",alignItems:"center",gap:"10px",cursor:"pointer",fontSize:"13px"}},[reqChk," 必須項目にする"]),
      errEl,
    ]),
    mftr(()=>ov.remove(),async()=>{
      if(!name.trim()||!dlVal) return showErr(errEl,"名前と締切日を入力してください");
      const sl=sizesStr.split(/[,、\s]+/).map(s=>s.trim()).filter(Boolean);
      if(!sl.length) return showErr(errEl,"サイズを入力してください");
      const data={name:name.trim(),description:desc.trim(),sizes:sl,deadline:new Date(dlVal).toISOString(),required,imageUrl};
      if(isE){ Object.assign(item,data); await DB.saveItem(item); }
      else { const newItem={...data,id:genId(),createdAt:new Date().toISOString()}; S.items.push(newItem); await DB.saveItem(newItem); }
      ov.remove(); onSave();
    },isE?"更新":"追加"),
  );
  const ov=overlay(box,()=>ov.remove());
}

// ── Teacher: Matches ────────────────────────────────────────────────────────────
function renderTMatches(root){
  let typeFilter="all"; // all|practice|tournament
  const rebuild=async()=>{
    root.innerHTML="";
    S.matches=await DB.getMatches();
    S.matches.sort((a,b)=>b.date.localeCompare(a.date));
    const filtered=typeFilter==="all"?S.matches:S.matches.filter(m=>m.type===typeFilter);

    // summary stats
    const total=filtered.length;
    const wins=filtered.filter(m=>m.result==="win").length;
    const losses=filtered.filter(m=>m.result==="loss").length;

    const filterBar=div({style:{display:"flex",gap:"8px",marginBottom:"16px",flexWrap:"wrap"}});
    [["all","すべて"],["practice","練習試合"],["tournament","大会"]].forEach(([k,l])=>{
      const b=btn({className:`sc ${typeFilter===k?"on":""}`,onClick:()=>{ typeFilter=k; rebuild(); }},[l]);
      filterBar.append(b);
    });

    const statRow=div({style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"12px",marginBottom:"20px"}},[
      statCard("試合数",total,"var(--text)"),
      statCard("勝ち",wins,"var(--green)"),
      statCard("負け",losses,"var(--red)"),
    ]);

    // group by student
    const byStudent={};
    filtered.forEach(m=>{
      const key=m.studentId;
      if(!byStudent[key]) byStudent[key]=[];
      byStudent[key].push(m);
    });

    const tblRows=[];
    S.students.forEach(s=>{
      const ms=byStudent[s.id]||[];
      if(!ms.length) return;
      const w=ms.filter(m=>m.result==="win").length;
      const l=ms.filter(m=>m.result==="loss").length;
      const tr=el("tr");
      tr.append(
        el("td",{style:{fontWeight:600}},[s.name]),
        el("td",{style:{color:"var(--muted)"}},[`${s.grade}年${s.cls}組`]),
        el("td",{},[String(ms.length)]),
        el("td",{style:{color:"var(--green)"}},[String(w)]),
        el("td",{style:{color:"var(--red)"}},[String(l)]),
        el("td",{},[ms.length?`${Math.round(w/ms.length*100)}%`:"—"]),
      );
      tr.addEventListener("click",()=>openMatchListModal(s,ms,rebuild));
      tblRows.push(tr);
    });

    root.append(
      div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}},[
        div({style:{fontSize:"20px",fontWeight:700}},["🏸 試合記録"]),
      ]),
      filterBar, statRow,
      tblRows.length?div({className:"tw"},[el("table",{},[
        el("thead",{},[el("tr",{},[el("th",{},["氏名"]),el("th",{},["学年/組"]),el("th",{},["試合数"]),el("th",{},["勝"]),el("th",{},["負"]),el("th",{},["勝率"])])]),
        el("tbody",{},tblRows),
      ])]):emptyState("🏸","試合記録がありません"),
    );
  };
  rebuild();
}

function openMatchListModal(student,matches,onUpdate){
  const box=div({className:"mb",style:{maxWidth:"600px"}});
  const listEl=div({});
  const buildList=()=>{
    listEl.innerHTML="";
    if(!matches.length){ listEl.append(emptyState("🏸","記録なし")); return; }
    matches.sort((a,b)=>b.date.localeCompare(a.date));
    matches.forEach(m=>{
      const typeLabel=m.type==="tournament"?"🏆 大会":"🎯 練習試合";
      const eventLabel=m.eventName?` · ${m.eventName}`:"";
      const resultBadge=badge(m.result==="win"?"b-g":"b-r",m.result==="win"?"勝ち":"負け");
      const categoryLabel={singles:"シングルス",doubles:"ダブルス",team:"団体戦"}[m.category]||m.category;
      const scoreText=m.scores?.length?m.scores.map(s=>`${s.my}-${s.opp}`).join(", "):"";
      const row=div({style:{padding:"12px 0",borderBottom:"1px solid var(--border)",display:"flex",gap:"12px",alignItems:"flex-start"}},[
        div({style:{flex:1}},[
          div({style:{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap",marginBottom:"4px"}},[
            span({style:{fontSize:"12px",color:"var(--muted)"}},[m.date]),
            span({style:{fontSize:"12px",color:"var(--accent)"}},[typeLabel+eventLabel]),
            badge("b-0",categoryLabel),
            resultBadge,
          ]),
          div({style:{fontSize:"13px",fontWeight:600,marginBottom:"2px"}},[`vs ${m.opponentName}（${m.opponentSchool}）`]),
          scoreText?div({style:{fontSize:"12px",color:"var(--muted)"}},[`スコア: ${scoreText}`]):"",
          m.note?div({style:{fontSize:"12px",color:"var(--muted)",marginTop:"2px"}},[`📝 ${m.note}`]):"",
        ]),
        btn({className:"btn btn-d sm",onClick:async()=>{
          if(!confirm("削除しますか？"))return;
          await DB.deleteMatch(m.id);
          S.matches=S.matches.filter(x=>x.id!==m.id);
          matches.splice(matches.indexOf(m),1);
          buildList(); onUpdate();
        }},["削除"]),
      ]);
      listEl.append(row);
    });

  buildList();
  box.append(
    mhdr(`🏸 ${student.name}の試合記録`,()=>ov.remove()),

      btn({className:"btn btn-g",onClick:()=>ov.remove()},["閉じる"]),
    ]),
  );
  const ov=overlay(box,()=>ov.remove());
}

function renderSMatches(root,student){
  root.innerHTML="";
  let typeFilter="all";
  const rebuild=()=>{
    root.innerHTML="";
    const allMatches=S.matches.sort((a,b)=>b.date.localeCompare(a.date));
    const myMatches=allMatches.filter(m=>m.studentId===student.id);
    const filtered=typeFilter==="all"?allMatches:allMatches.filter(m=>m.type===typeFilter);
    const myFiltered=typeFilter==="all"?myMatches:myMatches.filter(m=>m.type===typeFilter);

    const myWins=myFiltered.filter(m=>m.result==="win").length;
    const myTotal=myFiltered.length;

    // filter bar
    const filterBar=div({style:{display:"flex",gap:"8px",marginBottom:"16px",flexWrap:"wrap"}});
    [["all","すべて"],["practice","練習試合"],["tournament","大会"]].forEach(([k,l])=>{
      const b=btn({className:`sc ${typeFilter===k?"on":""}`,onClick:()=>{ typeFilter=k; rebuild(); }},[l]);
      filterBar.append(b);
    });

    // my stats
    const myStats=div({style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"12px",marginBottom:"20px"}},[
      statCard("自分の試合数",myTotal,"var(--text)"),
      statCard("勝ち",myWins,"var(--green)"),
      statCard("勝率",myTotal?`${Math.round(myWins/myTotal*100)}%`:"—","var(--accent)"),
    ]);

    // my record button
    const myBtn=btn({className:"btn btn-p",style:{marginBottom:"20px"},onClick:()=>openMatchModal(student,()=>{ renderStudent(); })},["＋ 試合を記録する"]);

    // all members records table
    const memberRows=[];
    S.students.forEach(s=>{
      const ms=filtered.filter(m=>m.studentId===s.id);
      if(!ms.length)return;
      const w=ms.filter(m=>m.result==="win").length;
      const tr=el("tr",{style:{cursor:"pointer"}});
      tr.addEventListener("click",()=>openMatchListModal(s,ms.slice(),()=>renderStudent()));
      tr.append(
        el("td",{style:{fontWeight:s.id===student.id?700:400}},[s.name+(s.id===student.id?" （自分）":"")]),
        el("td",{style:{color:"var(--muted)"}},[`${s.grade}年${s.cls}組`]),
        el("td",{},[String(ms.length)]),
        el("td",{style:{color:"var(--green)"}},[String(w)]),
        el("td",{style:{color:"var(--red)"}},[String(ms.length-w)]),
        el("td",{},[ms.length?`${Math.round(w/ms.length*100)}%`:"—"]),
      );
      memberRows.push(tr);
    });

    root.append(
      filterBar,
      div({style:{fontWeight:700,fontSize:"15px",marginBottom:"12px"}},["📊 自分の成績"]),
      myStats, myBtn,
      div({style:{fontWeight:700,fontSize:"15px",marginBottom:"12px"}},["👥 部員全員の記録"]),
      memberRows.length?div({className:"tw"},[el("table",{},[
        el("thead",{},[el("tr",{},[el("th",{},["氏名"]),el("th",{},["学年/組"]),el("th",{},["試合数"]),el("th",{},["勝"]),el("th",{},["負"]),el("th",{},["勝率"])])]),
        el("tbody",{},memberRows),
      ])]):emptyState("🏸","まだ記録がありません"),
    );
  };
  rebuild();
}

function renderTAttribute(root){
  root.innerHTML="";
  // 生徒選択 + 診断結果表示エリア
  let selStudentId = S.students.length ? S.students[0].id : null;
  let trialMode = false; // 生徒なしのお試し

  const resultArea = div({});
  const answers = {}; // qN -> "fire"|"earth"|"wind"|null

  // 生徒セレクト
  const studentSel = sel({className:"inp",style:{maxWidth:"260px"}},[
    opt("__trial","── お試し（保存なし）──", !selStudentId),
    ...S.students.map(s=>opt(s.id,`${s.name}（${s.grade}年${s.cls}組）`,s.id===selStudentId)),
  ]);
  studentSel.addEventListener("change",e=>{
    const v=e.target.value;
    trialMode = v==="__trial";
    selStudentId = trialMode ? null : v;
    // 保存済み診断を読み込む
    Object.keys(answers).forEach(k=>delete answers[k]);
    if(!trialMode){
      const st=S.students.find(s=>s.id===selStudentId);
      if(st?.attrAnswers) Object.assign(answers,st.attrAnswers);
    }
    buildDiag();
  });

  // 初期ロード：保存済み回答
  if(selStudentId){
    const st=S.students.find(s=>s.id===selStudentId);
    if(st?.attrAnswers) Object.assign(answers,st.attrAnswers);
  }

  const buildDiag = () => {
    resultArea.innerHTML="";

    // 質問カード群
    const qCards = ATTR_QUESTIONS.map(q=>{
      const card=div({style:{background:"var(--card)",border:"1px solid var(--border)",borderRadius:"var(--r)",padding:"16px 20px",marginBottom:"10px"}});
      const titleRow=div({style:{fontWeight:700,fontSize:"14px",marginBottom:"12px",color:"var(--accent)"}},[q.label]);
      const optRow=div({style:{display:"flex",flexDirection:"column",gap:"8px"}});

      [["fire",q.fire],["earth",q.earth],["wind",q.wind]].forEach(([attr,text])=>{
        const sel_flag = answers[q.id]===attr;
        const row=div({style:{
          display:"flex",alignItems:"flex-start",gap:"12px",padding:"10px 14px",
          borderRadius:"8px",border:`1.5px solid ${sel_flag?ATTR_COLOR[attr]:"var(--border)"}`,
          background:sel_flag?`${ATTR_COLOR[attr]}18`:"transparent",
          cursor:"pointer",transition:"all .18s",
        }});
        const dot=div({style:{
          width:"18px",height:"18px",borderRadius:"50%",flexShrink:0,marginTop:"1px",
          border:`2px solid ${ATTR_COLOR[attr]}`,
          background:sel_flag?ATTR_COLOR[attr]:"transparent",
          transition:"all .18s",
        }});
        const labelEl=div({style:{fontSize:"13px",lineHeight:1.6}},[
          span({style:{fontSize:"11px",fontWeight:700,color:ATTR_COLOR[attr],marginRight:"6px"}},[ATTR_LABEL[attr]]),
          text,
        ]);
        row.append(dot,labelEl);
        row.addEventListener("click",()=>{
          answers[q.id]=attr;
          buildDiag();
        });
        row.addEventListener("mouseenter",()=>{ if(!sel_flag){ row.style.borderColor=ATTR_COLOR[attr]; row.style.background=`${ATTR_COLOR[attr]}0a`; } });
        row.addEventListener("mouseleave",()=>{ if(!sel_flag){ row.style.borderColor="var(--border)"; row.style.background="transparent"; } });
        optRow.append(row);
      });
      card.append(titleRow,optRow);
      return card;
    });

    // 結果計算
    const counts={fire:0,earth:0,wind:0};
    Object.values(answers).forEach(v=>{ if(v) counts[v]++; });
    const total=Object.values(counts).reduce((a,b)=>a+b,0);
    const answered=total;
    const pcts={
      fire:  total?Math.round(counts.fire/total*100):0,
      earth: total?Math.round(counts.earth/total*100):0,
      wind:  total?Math.round(counts.wind/total*100):0,
    };
    const dominant=total?Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0]:null;

    // 結果パネル
    const resultPanel=div({style:{background:"var(--navy-mid)",border:"1px solid var(--border)",borderRadius:"var(--r)",padding:"20px",marginBottom:"20px"}});
    if(total===0){
      resultPanel.append(div({style:{color:"var(--muted)",fontSize:"13px",textAlign:"center",padding:"16px 0"}},["← 各項目を選択すると結果が表示されます"]));
    } else {
      // ドミナント表示
      const domEl = dominant ? div({style:{textAlign:"center",marginBottom:"20px"}},[
        div({style:{fontSize:"36px",marginBottom:"6px"}},[{fire:"🔥",earth:"🌍",wind:"💨"}[dominant]]),
        div({style:{fontSize:"22px",fontWeight:900,color:ATTR_COLOR[dominant],fontFamily:"'Bebas Neue',sans-serif",letterSpacing:"2px"}},[ATTR_LABEL[dominant]+" タイプ"]),
        div({style:{fontSize:"12px",color:"var(--muted)",marginTop:"4px"}},[`（${answered}/9項目回答済み）`]),
      ]) : "";

      // バーグラフ
      const bars=div({style:{display:"flex",flexDirection:"column",gap:"10px",marginBottom:"16px"}});
      ["fire","earth","wind"].forEach(attr=>{
        const pct=pcts[attr];
        const barWrap=div({style:{display:"flex",alignItems:"center",gap:"12px"}});
        barWrap.append(
          div({style:{width:"52px",fontSize:"12px",fontWeight:700,color:ATTR_COLOR[attr],flexShrink:0}},[ATTR_LABEL[attr]]),
          div({style:{flex:1,height:"10px",background:"var(--navy-light)",borderRadius:"5px",overflow:"hidden"}},[
            div({style:{height:"100%",width:`${pct}%`,background:ATTR_COLOR[attr],borderRadius:"5px",transition:"width .5s ease"}}),
          ]),
          div({style:{width:"40px",textAlign:"right",fontSize:"13px",fontWeight:700,color:ATTR_COLOR[attr]}},[`${pct}%`]),
          div({style:{width:"28px",textAlign:"right",fontSize:"11px",color:"var(--muted)"}},[`${counts[attr]}票`]),
        );
        bars.append(barWrap);
      });

      // 説明
      const descEl = dominant ? div({style:{fontSize:"13px",color:"var(--muted)",lineHeight:1.7,padding:"12px 14px",background:"var(--navy)",borderRadius:"8px",marginBottom:"16px"}},[ ATTR_DESC[dominant] ]) : "";

      // 保存ボタン
      const st=selStudentId?S.students.find(s=>s.id===selStudentId):null;
      const savedEl=div({className:"hidden",style:{color:"var(--green)",fontSize:"12px",marginLeft:"8px"}},["✓ 保存しました"]);
      const saveBtn = !trialMode && st ? btn({className:"btn btn-p sm",onClick:async()=>{
        st.attrAnswers={...answers};
        st.attrResult={counts,pcts,dominant,updatedAt:new Date().toISOString()};
        await DB.saveStudent(st);
        savedEl.className="";
        setTimeout(()=>savedEl.className="hidden",2500);
      }},["💾 診断結果を保存"]) : span({style:{fontSize:"12px",color:"var(--muted)"}},["※ お試しモードは保存されません"]);

      resultPanel.append(domEl, bars, descEl,
        div({style:{display:"flex",alignItems:"center",gap:"8px"}},[saveBtn,savedEl])
      );
    }

    resultArea.append(resultPanel,...qCards);
  };

  // 既存の診断結果サマリー（生徒一覧）
  const summaryRows=S.students.map(s=>{
    if(!s.attrResult) return null;
    const {dominant,pcts}=s.attrResult;
    const tr=el("tr");
    tr.append(
      el("td",{style:{fontWeight:600}},[s.name]),
      el("td",{style:{color:"var(--muted)"}},[`${s.grade}年${s.cls}組`]),
      el("td",{},[dominant?span({style:{fontWeight:700,color:ATTR_COLOR[dominant]}},[ATTR_LABEL[dominant]]):badge("b-0","未診断")]),
      el("td",{},[dominant?div({style:{display:"flex",gap:"6px",alignItems:"center"}},[
        ...["fire","earth","wind"].map(a=>
          span({style:{fontSize:"11px",color:ATTR_COLOR[a]}},[`${ATTR_LABEL[a]}${pcts[a]}%`])
        ),
      ]):"—"]),
    );
    tr.addEventListener("click",()=>{
      studentSel.value=s.id;
      studentSel.dispatchEvent(new Event("change"));
    });
    return tr;
  }).filter(Boolean);

  root.append(
    div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px",flexWrap:"wrap",gap:"12px"}},[
      div({style:{fontSize:"20px",fontWeight:700}},["🔥 属性診断"]),
      div({style:{display:"flex",gap:"10px",alignItems:"center",flexWrap:"wrap"}},[
        label({className:"ff-label",style:{margin:0}},["対象："]),
        studentSel,
      ]),
    ]),

    // 診断済み一覧
    summaryRows.length ? div({style:{marginBottom:"24px"}},[
      div({style:{fontSize:"13px",fontWeight:700,color:"var(--muted)",marginBottom:"10px"}},["診断済み一覧（クリックで再診断）"]),
      div({className:"tw"},[el("table",{},[
        el("thead",{},[el("tr",{},[el("th",{},["氏名"]),el("th",{},["学年/組"]),el("th",{},["主属性"]),el("th",{},["割合"])])]),
        el("tbody",{},summaryRows),
      ])]),
    ]) : "",

    resultArea,
  );

  buildDiag();
}

// ─── Boot ───────────────────────────────────────────────────────────────────────
(async()=>{
  try{
    await loadAll();
    render(renderLogin);
  }catch(e){
    app.innerHTML=`<div class="loading-screen"><div style="color:var(--red);font-size:14px">⚠ 接続エラー: ${e.message}</div></div>`;
  }
})();
</script>
</body>
</html>
