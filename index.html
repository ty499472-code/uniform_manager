  // 初回：デフォルトカテゴリを保存
  if(!categories.length){
    for(const c of DEF_CATEGORIES){ await DB.saveManageCategory(c); }
    categories=[...DEF_CATEGORIES];
  }

  let selCatId=categories[0]?.id||"";

  // ── レイアウト ──
  const leftCol=div({style:{flex:"0 0 200px",minWidth:0,display:"flex",flexDirection:"column",gap:"6px"}});
  const rightCol=div({style:{flex:"1 1 0",minWidth:0}});
  root.append(
    div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px",flexWrap:"wrap",gap:"10px"}},[
      div({style:{fontSize:"20px",fontWeight:700}},["🗂 管理"]),
      btn({className:"btn btn-g",style:{background:"rgba(74,158,255,.12)",color:"var(--blue)",border:"1px solid rgba(74,158,255,.3)"},onClick:()=>openSettlementModal(categories)},["📊 決算書を作成"]),
    ]),
    div({style:{display:"flex",gap:"20px",alignItems:"flex-start",flexWrap:"wrap"}},[ leftCol, rightCol ]),
  );

  const buildRight=async()=>{
    rightCol.innerHTML="";
    const cat=categories.find(c=>c.id===selCatId);
    if(!cat) return;
    const [subs,ledger]=await Promise.all([
      DB.getManageSubmissions(cat.id),
      DB.getManageLedger(cat.id),
    ]);

    // ── 収支管理（上部に配置）──
    const calcSummary=()=>{
      const inc=ledger.filter(e=>e.type==="income").reduce((a,e)=>a+Number(e.amount||0),0);
      const exp=ledger.filter(e=>e.type==="expense").reduce((a,e)=>a+Number(e.amount||0),0);
      return {inc,exp,bal:inc-exp};
    };
    const summaryEl=div({style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"10px",marginBottom:"12px"}});
    const renderSummary=()=>{
      const {inc,exp,bal}=calcSummary();
      summaryEl.innerHTML="";
      summaryEl.append(
        div({className:"card",style:{textAlign:"center",padding:"12px"}},[div({style:{fontSize:"11px",color:"var(--muted)",marginBottom:"4px"}},["収入合計"]),div({style:{fontSize:"20px",fontWeight:900,color:"var(--green)"}},[`¥${inc.toLocaleString()}`])]),
        div({className:"card",style:{textAlign:"center",padding:"12px"}},[div({style:{fontSize:"11px",color:"var(--muted)",marginBottom:"4px"}},["支出合計"]),div({style:{fontSize:"20px",fontWeight:900,color:"var(--red)"}},[`¥${exp.toLocaleString()}`])]),
        div({className:"card",style:{textAlign:"center",padding:"12px"}},[div({style:{fontSize:"11px",color:"var(--muted)",marginBottom:"4px"}},["残高"]),div({style:{fontSize:"20px",fontWeight:900,color:bal>=0?"var(--accent)":"var(--red)"}},[`¥${bal.toLocaleString()}`])]),
      );
    };
    const updateSummary=()=>renderSummary();

    // 収支明細（折り畳み）
    let ledgerOpen=false;
    const ledgerArrow=span({style:{color:"var(--accent)",fontSize:"14px",transition:"transform .2s",transform:"rotate(-90deg)"}},["▼"]);
    const ledgerHdr=div({style:{fontWeight:700,fontSize:"15px",marginBottom:"12px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",userSelect:"none"}},[
      div({style:{display:"flex",alignItems:"center",gap:"8px"}},[`💰 収支管理 — ${cat.name}`, ledgerArrow]),
      btn({className:"btn btn-p sm",onClick:e=>{ e.stopPropagation(); openLedgerModal(cat,ledger,buildRight); }},["＋ 記録を追加"]),
    ]);
    const ledgerBody=div({style:{display:"none"}});
    if(ledger.length){
      const lrows=[...ledger].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>{
        const tr=el("tr");
        tr.append(
          el("td",{style:{fontSize:"12px",color:"var(--muted)"}},[fmtDs(e.date)]),
          el("td",{},[e.description||"—"]),
          el("td",{},[badge(e.type==="income"?"b-g":"b-r",e.type==="income"?"収入":"支出")]),
          el("td",{style:{fontWeight:700,color:e.type==="income"?"var(--green)":"var(--red)",textAlign:"right"}},[`¥${Number(e.amount||0).toLocaleString()}`]),
          el("td",{},[e.receiptImg?btn({className:"btn btn-g sm",onClick:()=>{ const w=window.open("","_blank"); w.document.write(`<html><body style="margin:0;background:#000"><img src="${e.receiptImg}" style="max-width:100%;max-height:100vh;display:block;margin:auto"></body></html>`); w.document.close(); }},["🖼 領収書"]):""]),
          el("td",{style:{padding:"6px 14px"}},[btn({className:"btn btn-d sm",onClick:async()=>{ if(!confirm("削除しますか？"))return; await DB.deleteManageLedger(cat.id,e.id); buildRight(); }},["削除"])]),
        );
        return tr;
      });
      ledgerBody.append(div({className:"tw",style:{marginBottom:"16px"}},[el("table",{},[
        el("thead",{},[el("tr",{},[el("th",{},["日付"]),el("th",{},["内容"]),el("th",{},["種別"]),el("th",{},["金額"]),el("th",{},["領収書"]),el("th",{})])]),
        el("tbody",{},lrows),
      ])]));
    } else {
      ledgerBody.append(div({style:{color:"var(--muted)",fontSize:"13px",padding:"12px 0",textAlign:"center"}},["収支記録がありません"]));
    }
    ledgerHdr.addEventListener("click",()=>{
      ledgerOpen=!ledgerOpen;
      ledgerBody.style.display=ledgerOpen?"block":"none";
      ledgerArrow.style.transform=ledgerOpen?"":"rotate(-90deg)";
    });

    rightCol.append(ledgerHdr, summaryEl, ledgerBody);
    renderSummary();

    // 区切り線
    rightCol.append(div({style:{height:"1px",background:"var(--border)",margin:"20px 0"}}));

    // ── 提出管理簿 ──
    rightCol.append(div({style:{fontWeight:700,fontSize:"15px",marginBottom:"12px",paddingBottom:"8px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}},[
      `📋 提出管理簿 — ${cat.name}`,
      cat.amount?span({style:{fontSize:"13px",color:"var(--accent)",fontWeight:700}},[`¥${Number(cat.amount).toLocaleString()}`]):"",
    ]));

    // 対象選手フィルター
    const grades=[...new Set(S.students.map(s=>s.grade))].sort();
    let filterGrade="all", filterGender="all";
    const filterBar=div({style:{display:"flex",gap:"8px",marginBottom:"12px",flexWrap:"wrap"}});
    const gradeOpts=sel({className:"inp",style:{flex:"0 0 100px"}},[ opt("all","全学年",true), ...grades.map(g=>opt(g,`${g}年`)) ]);
    const genderOpts=sel({className:"inp",style:{flex:"0 0 100px"}},[ opt("all","全員",true), opt("male","男子"), opt("female","女子"), opt("other","その他") ]);
    const rebuildTable=()=>{
      tableWrap.innerHTML="";
      const filtered=S.students.filter(s=>{
        const gOk=filterGrade==="all"||s.grade===filterGrade;
        const gdOk=filterGender==="all"||s.gender===filterGender;
        return gOk&&gdOk;
      }).sort((a,b)=>a.grade.localeCompare(b.grade)||a.cls.localeCompare(b.cls)||Number(a.number)-Number(b.number));
      const submitted=filtered.filter(s=>subs.find(x=>x.studentId===s.id&&x.submitted));
      const pct=filtered.length?Math.round(submitted.length/filtered.length*100):0;
      // 進捗バー
      tableWrap.append(div({style:{marginBottom:"10px"}},[
        div({style:{display:"flex",justifyContent:"space-between",fontSize:"12px",color:"var(--muted)",marginBottom:"4px"}},[
          `提出済 ${submitted.length}/${filtered.length}名`,
          `${pct}%`,
        ]),
        div({className:"pb"},[div({className:"pf",style:{width:`${pct}%`}})]),
      ]));
      // テーブル
      const rows=filtered.map(s=>{
        const sub=subs.find(x=>x.studentId===s.id);
        const isDone=sub?.submitted||false;
        const tr=el("tr");
        tr.append(
          el("td",{style:{fontSize:"12px",color:"var(--muted)"}},[`${s.grade}年${s.cls}組`]),
          el("td",{style:{fontWeight:600}},[s.name]),
          el("td",{},[isDone?badge("b-g","✓ 済"):badge("b-y","未提出")]),
          el("td",{style:{fontSize:"12px",color:"var(--muted)"}},[sub?.date?fmtDs(sub.date):"—"]),
          el("td",{style:{padding:"6px 14px"}},[
            btn({
              className:isDone?"btn btn-g sm":"btn btn-p sm",
              onClick:async()=>{
                const newSub={
                  id:s.id, studentId:s.id, studentName:s.name,
                  submitted:!isDone,
                  date:!isDone?new Date().toISOString().slice(0,10):"",
                  updatedAt:new Date().toISOString(),
                  ledgerEntryId: sub?.ledgerEntryId||null,
                };
                if(!isDone){
                  // 提出済み → 収入を自動追加（金額が設定されている場合）
                  if(cat.amount&&Number(cat.amount)>0){
                    const entryId=genId();
                    const entry={
                      id:entryId, type:"income",
                      date:newSub.date,
                      amount:Number(cat.amount),
                      description:`${s.name} — ${cat.name}`,
                      autoGenerated:true,
                      studentId:s.id,
                      createdAt:new Date().toISOString(),
                    };
                    await DB.saveManageLedger(cat.id,entry);
                    newSub.ledgerEntryId=entryId;
                    ledger.push(entry);
                  }
                } else {
                  // 取消 → 対応する収入記録を削除
                  const entryId=sub?.ledgerEntryId;
                  if(entryId){
                    await DB.deleteManageLedger(cat.id,entryId);
                    const li=ledger.findIndex(e=>e.id===entryId);
                    if(li>=0) ledger.splice(li,1);
                  }
                  newSub.ledgerEntryId=null;
                }
                await DB.saveManageSubmission(cat.id,newSub);
                const idx=subs.findIndex(x=>x.studentId===s.id);
                if(idx>=0) subs[idx]=newSub; else subs.push(newSub);
                rebuildTable();
                // 収支サマリーだけ更新（画面全体を再描画しない）
                updateSummary();
              },
            },[isDone?"取消":"提出済にする"]),
          ]),
        );
        return tr;
      });
      tableWrap.append(div({className:"tw"},[el("table",{},[
        el("thead",{},[el("tr",{},[el("th",{},["学年/組"]),el("th",{},["氏名"]),el("th",{},["状態"]),el("th",{},["提出日"]),el("th",{})])]),
        el("tbody",{},rows),
      ])]));
    };
    gradeOpts.addEventListener("change",e=>{ filterGrade=e.target.value; rebuildTable(); });
    genderOpts.addEventListener("change",e=>{ filterGender=e.target.value; rebuildTable(); });
    filterBar.append(gradeOpts,genderOpts);
    const tableWrap=div({});
    rightCol.append(filterBar,tableWrap);
    rebuildTable();
  };

  const buildLeft=()=>{
    leftCol.innerHTML="";
    leftCol.append(div({style:{fontWeight:600,fontSize:"12px",color:"var(--muted)",marginBottom:"8px",padding:"0 4px"}},["種別"]));
    categories.forEach(c=>{
      const isActive=selCatId===c.id;
      const card=div({style:{
        padding:"10px 12px",borderRadius:"8px",cursor:"pointer",transition:"all .15s",
        border:`1.5px solid ${isActive?c.color:"var(--border)"}`,
        background:isActive?`${c.color}18`:"var(--card)",
        display:"flex",justifyContent:"space-between",alignItems:"center",
      }});
      card.append(
        div({},[
          div({style:{fontWeight:600,fontSize:"13px",color:isActive?c.color:"var(--text)"}},[c.name]),
          c.amount?div({style:{fontSize:"11px",color:"var(--muted)",marginTop:"2px"}},[`¥${Number(c.amount).toLocaleString()}`]):"",
        ]),
        btn({className:"btn btn-g sm",style:{padding:"2px 6px",fontSize:"10px"},onClick:e=>{ e.stopPropagation(); openCategoryModal(c,async()=>{ categories=await DB.getManageCategories(); buildLeft(); buildRight(); }); }},["編集"]),
      );
      card.addEventListener("click",()=>{ selCatId=c.id; buildLeft(); buildRight(); });
      leftCol.append(card);
    });
    leftCol.append(btn({className:"btn btn-g",style:{width:"100%",justifyContent:"center",marginTop:"8px",fontSize:"12px"},onClick:()=>openCategoryModal(null,async()=>{ categories=await DB.getManageCategories(); buildLeft(); if(!selCatId&&categories.length) selCatId=categories[0].id; buildRight(); })},["＋ 種別を追加"]));
  };

  buildLeft();
  buildRight();
}

  const yearI=inp({className:"inp",type:"number",value:fiscalYear});
  const titleI=inp({className:"inp",value:title});
  yearI.addEventListener("input",e=>{ fiscalYear=Number(e.target.value); titleI.value=`${fiscalYear}年度 決算書`; title=titleI.value; });
  titleI.addEventListener("input",e=>title=e.target.value);
  const catList=div({style:{display:"flex",flexDirection:"column",gap:"6px"}});
  categories.forEach(cat=>{
    const isOn=selCats.has(cat.id);
    const row=div({style:{display:"flex",alignItems:"center",gap:"10px",padding:"8px 12px",borderRadius:"8px",border:`1.5px solid ${isOn?cat.color:"var(--border)"}`,background:isOn?`${cat.color}18`:"var(--card)",cursor:"pointer",transition:"all .15s"}});
    const chk=div({style:{width:"16px",height:"16px",borderRadius:"3px",border:`2px solid ${cat.color}`,background:isOn?cat.color:"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"10px",color:"#000",fontWeight:700,flexShrink:0}},[isOn?"✓":""]);
    row.append(chk,div({style:{flex:1,fontWeight:600,fontSize:"13px",color:isOn?cat.color:"var(--text)"}},[cat.name]));
    row.addEventListener("click",()=>{
      if(selCats.has(cat.id)) selCats.delete(cat.id); else selCats.add(cat.id);
      const on=selCats.has(cat.id);
      row.style.borderColor=on?cat.color:"var(--border)"; row.style.background=on?`${cat.color}18`:"var(--card)";
      chk.style.background=on?cat.color:"transparent"; chk.textContent=on?"✓":"";
    });
    catList.append(row);
  });
  box.append(
    mhdr("📊 決算書を作成",()=>ov.remove()),
    div({style:{padding:"24px",display:"flex",flexDirection:"column",gap:"14px"}},[
      div({className:"grid2"},[ff("年度",yearI),ff("タイトル",titleI)]),
      div({style:{fontWeight:600,fontSize:"13px"}},["集計する種別を選択"]),
      catList, errEl,
    ]),
    div({style:{padding:"14px 24px",borderTop:"1px solid var(--border)",display:"flex",gap:"8px",justifyContent:"flex-end"}},[
      btn({className:"btn btn-g",onClick:()=>ov.remove()},["キャンセル"]),
      btn({className:"btn btn-p",onClick:async()=>{
        if(!selCats.size) return showErr(errEl,"種別を1つ以上選択してください");
        ov.remove();
        await generateSettlementPdf(categories.filter(c=>selCats.has(c.id)),title,fiscalYear);
      }},["PDF を生成・印刷"]),
    ]),
  );
  const ov=overlay(box,()=>ov.remove());
}

async function generateSettlementPdf(categories,title,fiscalYear){
  const clubName=S.cfg.clubName||"清教学園バドミントン部";
  const today=new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric"});
  const catData=await Promise.all(categories.map(async cat=>{
    const [subs,ledger]=await Promise.all([DB.getManageSubmissions(cat.id),DB.getManageLedger(cat.id)]);
    const income=ledger.filter(e=>e.type==="income").reduce((a,e)=>a+Number(e.amount||0),0);
    const expense=ledger.filter(e=>e.type==="expense").reduce((a,e)=>a+Number(e.amount||0),0);
    const submitted=subs.filter(s=>s.submitted).length;
    return {cat,subs,ledger,income,expense,balance:income-expense,submitted};
  }));
  const totalIncome=catData.reduce((a,d)=>a+d.income,0);
  const totalExpense=catData.reduce((a,d)=>a+d.expense,0);
  const win=window.open("","_blank");
  if(!win){ alert("ポップアップがブロックされました"); return; }
  const catSections=catData.map(d=>{
    const rows=[...d.ledger].sort((a,b)=>a.date.localeCompare(b.date));
    const rowsHtml=rows.map(e=>`<tr><td style="padding:5px 10px;font-size:12px;border:1px solid #ddd">${new Date(e.date).toLocaleDateString("ja-JP")}</td><td style="padding:5px 10px;font-size:12px;border:1px solid #ddd">${e.description||"—"}</td><td style="padding:5px 10px;font-size:12px;text-align:center;border:1px solid #ddd">${e.type==="income"?"収入":"支出"}</td><td style="padding:5px 10px;font-size:12px;text-align:right;border:1px solid #ddd;color:${e.type==="income"?"#2e7d32":"#c62828"};font-weight:600">¥${Number(e.amount||0).toLocaleString()}</td></tr>`).join("");
    return `<div style="margin-bottom:28px;page-break-inside:avoid"><div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:8px 12px;background:${d.cat.color}18;border-left:4px solid ${d.cat.color};border-radius:4px"><div style="font-size:15px;font-weight:900;color:${d.cat.color}">${d.cat.name}</div>${d.cat.amount?`<div style="font-size:12px;color:#666">設定金額：¥${Number(d.cat.amount).toLocaleString()} × ${d.submitted}名</div>`:""}<div style="margin-left:auto;display:flex;gap:16px"><span style="font-size:12px;color:#2e7d32;font-weight:700">収入 ¥${d.income.toLocaleString()}</span><span style="font-size:12px;color:#c62828;font-weight:700">支出 ¥${d.expense.toLocaleString()}</span><span style="font-size:12px;font-weight:900;color:${d.balance>=0?"#1565c0":"#c62828"}">残高 ¥${d.balance.toLocaleString()}</span></div></div>${rows.length?`<table style="width:100%;border-collapse:collapse"><thead><tr style="background:#f5f5f5"><th style="padding:6px 10px;font-size:12px;text-align:left;border:1px solid #ddd">日付</th><th style="padding:6px 10px;font-size:12px;text-align:left;border:1px solid #ddd">内容</th><th style="padding:6px 10px;font-size:12px;text-align:center;border:1px solid #ddd">種別</th><th style="padding:6px 10px;font-size:12px;text-align:right;border:1px solid #ddd">金額</th></tr></thead><tbody>${rowsHtml}</tbody></table>`:`<div style="font-size:12px;color:#999;padding:8px">記録なし</div>`}</div>`;
  }).join("");
  win.document.write(`<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>${title}</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;background:#fff;color:#1a1a2e;padding:20mm 18mm}@page{size:A4;margin:0}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:14mm 14mm}}</style></head><body>
<div style="text-align:center;margin-bottom:24px;padding-bottom:14px;border-bottom:3px solid #1a1a2e"><div style="font-size:11px;color:#666;margin-bottom:4px">${clubName}</div><div style="font-size:24px;font-weight:900;letter-spacing:4px">${title}</div><div style="font-size:12px;color:#666;margin-top:6px">作成日：${today}</div></div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px"><div style="padding:12px;background:#e8f5e9;border-radius:8px;text-align:center;border:1px solid #a5d6a7"><div style="font-size:11px;color:#2e7d32;font-weight:700;margin-bottom:4px">収入合計</div><div style="font-size:20px;font-weight:900;color:#2e7d32">¥${totalIncome.toLocaleString()}</div></div><div style="padding:12px;background:#ffebee;border-radius:8px;text-align:center;border:1px solid #ef9a9a"><div style="font-size:11px;color:#c62828;font-weight:700;margin-bottom:4px">支出合計</div><div style="font-size:20px;font-weight:900;color:#c62828">¥${totalExpense.toLocaleString()}</div></div><div style="padding:12px;background:${totalIncome-totalExpense>=0?"#e3f2fd":"#ffebee"};border-radius:8px;text-align:center;border:1px solid ${totalIncome-totalExpense>=0?"#90caf9":"#ef9a9a"}"><div style="font-size:11px;color:#1565c0;font-weight:700;margin-bottom:4px">残高</div><div style="font-size:20px;font-weight:900;color:${totalIncome-totalExpense>=0?"#1565c0":"#c62828"}">¥${(totalIncome-totalExpense).toLocaleString()}</div></div></div>
<table style="width:100%;border-collapse:collapse;margin-bottom:24px"><thead><tr style="background:#1a1a2e;color:#fff"><th style="padding:8px 12px;text-align:left;font-size:13px">種別</th><th style="padding:8px 12px;text-align:right;font-size:13px">収入</th><th style="padding:8px 12px;text-align:right;font-size:13px">支出</th><th style="padding:8px 12px;text-align:right;font-size:13px">残高</th></tr></thead><tbody>${catData.map((d,i)=>`<tr style="background:${i%2===0?"#fafafa":"#fff"}"><td style="padding:8px 12px;font-size:13px;border:1px solid #ddd;font-weight:600">${d.cat.name}</td><td style="padding:8px 12px;font-size:13px;border:1px solid #ddd;text-align:right;color:#2e7d32;font-weight:600">¥${d.income.toLocaleString()}</td><td style="padding:8px 12px;font-size:13px;border:1px solid #ddd;text-align:right;color:#c62828;font-weight:600">¥${d.expense.toLocaleString()}</td><td style="padding:8px 12px;font-size:13px;border:1px solid #ddd;text-align:right;font-weight:900;color:${d.balance>=0?"#1565c0":"#c62828"}">¥${d.balance.toLocaleString()}</td></tr>`).join("")}<tr style="background:#1a1a2e;color:#fff;font-weight:900"><td style="padding:8px 12px;font-size:13px">合計</td><td style="padding:8px 12px;font-size:13px;text-align:right">¥${totalIncome.toLocaleString()}</td><td style="padding:8px 12px;font-size:13px;text-align:right">¥${totalExpense.toLocaleString()}</td><td style="padding:8px 12px;font-size:13px;text-align:right">¥${(totalIncome-totalExpense).toLocaleString()}</td></tr></tbody></table>
<div style="font-size:15px;font-weight:900;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid #1a1a2e">明細</div>
${catSections}</body></html>`);
  win.document.close();
  setTimeout(()=>win.print(),800);
}

// ─── 目標設定タブ ───────────────────────────────────────────────────────────────
async function renderSGoal(root, student){
  root.innerHTML="";
  root.append(div({style:{color:"var(--muted)",fontSize:"13px",padding:"20px 0",textAlign:"center"}},["読み込み中..."]));
  const [goals,comments]=await Promise.all([
    DB.getGoals(student.id),
    DB.getGoalComments(student.id),
  ]);
  root.innerHTML="";

  const GTABS=[["match","🎯 試合目標"],["annual","🏆 年間目標"],["memo","📝 一言記録"],["review","📊 振り返り"]];
  let gTab="match";
  const gTabBar=div({className:"tabs",style:{marginBottom:"20px"}});
  const gTabBtns={};
  const gContent=div({});

  const switchGTab=k=>{
    gTab=k; GTABS.forEach(([tk])=>gTabBtns[tk].className=`tab ${tk===k?"on":""}`);
    gContent.innerHTML="";
    if(k==="match")  buildMatchGoal();
    if(k==="annual") buildAnnualGoal();
    if(k==="memo")   buildMemo();
    if(k==="review") buildReview();
  };
  GTABS.forEach(([k,l])=>{ const b=btn({className:`tab ${k===gTab?"on":""}`,onClick:()=>switchGTab(k)},[l]); gTabBtns[k]=b; gTabBar.append(b); });
  root.append(gTabBar, gContent);

  const getLatest=(type)=>goals.find(g=>g.type===type)||null;
  const getAll=(type)=>goals.filter(g=>g.type===type);

  // ── 🎯 次の試合目標 ──
  const buildMatchGoal=(initGoal=null)=>{
    gContent.innerHTML="";
    // initGoal=null → 新規、initGoal=goal → 編集（達成度入力後は null で新規）
    const editing=initGoal;
    const savedEl=div({className:"hidden",style:{color:"var(--green)",fontSize:"12px"}},["✓ 保存しました"]);
    const showSaved=()=>{ savedEl.className=""; setTimeout(()=>savedEl.className="hidden",2000); };
    let opp=editing?.opponent||"", date=editing?.date||"";
    const oppI=inp({className:"inp",placeholder:"例：○○高校"}); oppI.value=opp; oppI.addEventListener("input",e=>opp=e.target.value);
    const dateI=inp({className:"inp",type:"date"}); dateI.value=date; dateI.addEventListener("input",e=>date=e.target.value);
    const CATS=[
      {key:"physical", label:"💪 体力",  placeholder:"例：最後まで足を動かし続ける"},
      {key:"technical",label:"🏸 技術",  placeholder:"例：バック奥のクリアを安定させる"},
      {key:"mental",   label:"🧠 メンタル",placeholder:"例：ミスしても切り替えて次に集中する"},
    ];
    const vals={};
    CATS.forEach(c=>{ vals[c.key]={goal:editing?.[c.key]?.goal||"", score:editing?.[c.key]?.score||0}; });

    const catEls=CATS.map(c=>{
      const tI=ta({className:"inp",rows:2},vals[c.key].goal); tI.placeholder=c.placeholder; tI.addEventListener("input",e=>vals[c.key].goal=e.target.value);
      const scoreRow=div({style:{display:"flex",gap:"6px",marginTop:"8px"}});
      const stars=[];
      for(let i=1;i<=5;i++){
        const s=btn({className:"sc",style:{flex:1,justifyContent:"center",fontSize:"18px",padding:"6px 0",
          color:i<=vals[c.key].score?"var(--accent)":"var(--navy-light)",
          borderColor:i<=vals[c.key].score?"var(--accent)":"var(--border)"}},[" ★"]);
        s.addEventListener("click",()=>{
          vals[c.key].score=i;
          stars.forEach((x,j)=>{
            x.style.color=j+1<=i?"var(--accent)":"var(--navy-light)";
            x.style.borderColor=j+1<=i?"var(--accent)":"var(--border)";
          });
        });
        stars.push(s); scoreRow.append(s);
      }
      return div({className:"card",style:{marginBottom:"12px"}},[
        div({style:{fontWeight:700,fontSize:"14px",marginBottom:"10px"}},[c.label]),
        ff("目標",tI),
        div({style:{marginTop:"8px"}},[
          div({style:{fontSize:"12px",color:"var(--muted)",marginBottom:"6px"}},["達成度（試合後に記録）"]),
          scoreRow,
        ]),
      ]);
    });

    // 保存ボタン：相手＋日付が同じなら上書き
    const doSave=async(thenNew=false)=>{
      // 同じ相手＋日付のものがあれば上書き、なければ新規
      const existing=goals.find(g=>g.type==="match_goal"&&g.opponent===opp.trim()&&g.date===date&&(!editing||g.id===editing.id));
      const goal={
        id:existing?.id||editing?.id||genId(),
        type:"match_goal", opponent:opp.trim(), date,
        ...Object.fromEntries(CATS.map(c=>[c.key,{...vals[c.key]}])),
        createdAt:existing?.createdAt||editing?.createdAt||new Date().toISOString(),
        updatedAt:new Date().toISOString(),
      };
      await DB.saveGoal(student.id,goal);
      DB.notifyGoalUpdated(student.id).catch(()=>{});
      const idx=goals.findIndex(g=>g.id===goal.id);
      if(idx>=0) goals[idx]=goal; else goals.unshift(goal);
      if(thenNew){
        // 達成度保存後 → 新規入力画面へ
        buildMatchGoal(null);
      } else {
        showSaved();
      }
    };

    const hasScore=CATS.some(c=>vals[c.key].score>0);

    gContent.append(
      div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}},[
        div({style:{fontSize:"16px",fontWeight:700}},["🎯 次の試合目標"]),
        editing?btn({className:"btn btn-d sm",onClick:async()=>{
          if(!confirm("この目標を削除しますか？"))return;
          await DB.deleteGoal(student.id,editing.id);
          goals.splice(goals.indexOf(editing),1);
          buildMatchGoal(null);
        }},["🗑 削除"]):"",
      ]),
      div({className:"card",style:{marginBottom:"16px"}},[
        div({className:"grid2"},[ff("対戦相手",oppI),ff("試合日",dateI)]),
      ]),
      ...catEls,
      div({style:{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}},[
        btn({className:"btn btn-p",onClick:()=>doSave(false)},["💾 保存する"]),
        hasScore?btn({className:"btn btn-g",onClick:()=>doSave(true)},["✅ 達成度を保存して新規入力へ"]):"",
        savedEl,
      ]),
    );

    // 過去の試合目標一覧（コンパクト表示）
    const pastGoals=goals.filter(g=>g.type==="match_goal");
    if(pastGoals.length>0){
      const listEl=div({style:{marginTop:"20px"}});
      listEl.append(div({style:{fontWeight:600,fontSize:"13px",marginBottom:"8px",color:"var(--muted)"}},[`過去の試合目標（${pastGoals.length}件）`]));
      pastGoals.forEach(g=>{
        const stars=n=>Array.from({length:5},(_,i)=>span({style:{color:i<n?"var(--accent)":"var(--navy-light)",fontSize:"12px"}},["★"]));
        const scores=CATS.map(c=>g[c.key]?.score||0);
        const hasS=scores.some(s=>s>0);
        const row=div({style:{
          padding:"10px 12px",marginBottom:"6px",borderRadius:"8px",
          border:`1px solid ${g.id===editing?.id?"var(--accent)":"var(--border)"}`,
          background:g.id===editing?.id?"rgba(244,162,40,.08)":"var(--card)",
          cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",
        }});
        row.append(
          div({style:{flex:1}},[
            div({style:{fontWeight:600,fontSize:"13px"}},[g.opponent?`vs ${g.opponent}`:"試合",g.date?span({style:{fontSize:"11px",color:"var(--muted)",marginLeft:"6px"}},[fmtDs(g.date)]):"",]),
            hasS?div({style:{display:"flex",gap:"6px",marginTop:"3px"}},[
              ...CATS.map(c=>div({style:{display:"flex",alignItems:"center",gap:"2px"}},[
                span({style:{fontSize:"10px",color:"var(--muted)"}},[c.label.slice(0,2)]),
                ...stars(g[c.key]?.score||0),
              ])),
            ]):"",
          ]),
          div({style:{display:"flex",gap:"6px"}},[
            btn({className:"btn btn-g sm",onClick:()=>buildMatchGoal(g)},["編集"]),
            btn({className:"btn btn-d sm",onClick:async e=>{
              e.stopPropagation();
              if(!confirm("削除しますか？"))return;
              await DB.deleteGoal(student.id,g.id);
              goals.splice(goals.indexOf(g),1);
              buildMatchGoal(null);
            }},["削除"]),
          ]),
        );
        listEl.append(row);
      });
      gContent.append(listEl);
    }
  };

  // ── 🏆 年間目標 ──
  const buildAnnualGoal=()=>{
    gContent.innerHTML="";
    const latest=getLatest("annual_goal");
    const savedEl=div({className:"hidden",style:{color:"var(--green)",fontSize:"12px"}},["✓ 保存しました"]);
    const showSaved=()=>{ savedEl.className=""; setTimeout(()=>savedEl.className="hidden",2000); };

    const DEF_CATS=[
      {key:"technical", label:"🏸 技術面"},
      {key:"humanity",  label:"🤝 人間性"},
      {key:"lifestyle", label:"🌅 生活面"},
      {key:"mental",    label:"🧠 精神面"},
    ];

    // cats: [{key, label, items:[{id,text}], score}]
    let cats=latest?.cats
      ? latest.cats.map(c=>({...c,items:c.items.map(i=>({...i}))}))
      : DEF_CATS.map(c=>({
          key:c.key, label:c.label,
          items: latest?.[c.key]?[{id:genId(),text:latest[c.key]}]:[{id:genId(),text:""}],
          score:0,
        }));

    let year=latest?.year||new Date().getFullYear();
    const yearI=inp({className:"inp",type:"number",value:year,style:{maxWidth:"120px"}});
    yearI.addEventListener("input",e=>year=Number(e.target.value));

    const catsWrap=div({style:{display:"flex",flexDirection:"column",gap:"12px"}});

    const makeStarRow=(cat)=>{
      const row=div({style:{display:"flex",gap:"5px",marginTop:"8px"}});
      const stars=[];
      for(let i=1;i<=5;i++){
        const on=i<=(cat.score||0);
        const s=btn({className:"sc",style:{flex:1,justifyContent:"center",fontSize:"16px",padding:"4px 0",
          color:on?"var(--accent)":"var(--navy-light)",borderColor:on?"var(--accent)":"var(--border)"}},[" ★"]);
        s.addEventListener("click",()=>{
          cat.score=i;
          stars.forEach((x,j)=>{
            x.style.color=j+1<=i?"var(--accent)":"var(--navy-light)";
            x.style.borderColor=j+1<=i?"var(--accent)":"var(--border)";
          });
        });
        stars.push(s); row.append(s);
      }
      return row;
    };

    const rebuildCats=()=>{
      catsWrap.innerHTML="";
      cats.forEach((cat,ci)=>{
        const itemsWrap=div({style:{display:"flex",flexDirection:"column",gap:"6px"}});
        const rebuildItems=()=>{
          itemsWrap.innerHTML="";
          cat.items.forEach((item,ii)=>{
            const row=div({style:{display:"flex",flexDirection:"column",gap:"6px",padding:"10px",background:"var(--navy)",borderRadius:"8px",border:"1px solid var(--border)"}});
            // 目標 + 削除ボタン
            const topRow=div({style:{display:"flex",gap:"6px",alignItems:"center"}});
            const tI=inp({className:"inp",value:item.text||"",placeholder:"目標を入力..."});
            tI.addEventListener("input",e=>item.text=e.target.value);
            topRow.append(
              tI,
              cat.items.length>1?btn({className:"btn btn-d sm",style:{padding:"4px 8px",flexShrink:0},onClick:()=>{
                cat.items.splice(ii,1); rebuildItems();
              }},["×"]):"",
            );
            // そのためにやること
            const actionI=inp({className:"inp",value:item.action||"",placeholder:"そのためにやること..."});
            actionI.style.fontSize="12px";
            actionI.addEventListener("input",e=>item.action=e.target.value);
            const actionRow=div({style:{display:"flex",alignItems:"center",gap:"6px"}},[
              span({style:{fontSize:"11px",color:"var(--accent)",whiteSpace:"nowrap",fontWeight:600}},["→"]),
              actionI,
            ]);
            row.append(topRow, actionRow);
            itemsWrap.append(row);
          });
          itemsWrap.append(btn({className:"btn btn-g sm",style:{alignSelf:"flex-start",marginTop:"4px"},onClick:()=>{
            cat.items.push({id:genId(),text:"",action:""}); rebuildItems();
          }},["＋ 項目を追加"]));
        };
        rebuildItems();
        const card=div({className:"card",style:{marginBottom:"0"}});
        card.append(
          div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}},[
            div({style:{fontWeight:700,fontSize:"14px"}},[cat.label]),
            ci>=4?btn({className:"btn btn-d sm",style:{padding:"2px 8px",fontSize:"10px"},onClick:()=>{
              cats.splice(ci,1); rebuildCats();
            }},["分類を削除"]):"",
          ]),
          itemsWrap,
          div({style:{marginTop:"10px"}},[
            div({style:{fontSize:"12px",color:"var(--muted)",marginBottom:"5px"}},["達成度評価（5段階）"]),
            makeStarRow(cat),
          ]),
        );
        catsWrap.append(card);
      });
    };
    rebuildCats();

    // 新しい分類を追加
    const newCatI=inp({className:"inp",placeholder:"新しい分類名（例：体力面）",style:{flex:1}});
    const addCatRow=div({style:{display:"flex",gap:"8px",marginTop:"8px"}});
    addCatRow.append(newCatI, btn({className:"btn btn-g",onClick:()=>{
      const label=newCatI.value.trim(); if(!label) return;
      cats.push({key:`custom_${genId()}`,label,items:[{id:genId(),text:""}],score:0});
      newCatI.value=""; rebuildCats();
    }},["＋ 分類を追加"]));

    gContent.append(
      div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}},[
        div({style:{fontSize:"16px",fontWeight:700}},["🏆 年間目標"]),
        ff("年度",yearI),
      ]),
      catsWrap,
      div({style:{marginTop:"12px",padding:"12px",background:"var(--navy)",borderRadius:"8px",border:"1px solid var(--border)"}},[
        div({style:{fontSize:"12px",color:"var(--muted)",marginBottom:"6px"}},["＋ 新しい分類を追加"]),
        addCatRow,
      ]),
      div({style:{height:"1px",background:"var(--border)",margin:"16px 0"}}),
      div({style:{display:"flex",gap:"8px",alignItems:"center"}},[
        btn({className:"btn btn-p",onClick:async()=>{
          const existing=goals.find(g=>g.type==="annual_goal"&&g.year===year);
          const goal={
            id:existing?.id||latest?.id||genId(),
            type:"annual_goal", year,
            cats:cats.map(c=>({key:c.key,label:c.label,items:c.items.map(i=>({id:i.id,text:i.text||""})),score:c.score||0})),
            technical:cats.find(c=>c.key==="technical")?.items.map(i=>i.text).filter(Boolean).join("、")||"",
            humanity: cats.find(c=>c.key==="humanity")?.items.map(i=>i.text).filter(Boolean).join("、")||"",
            lifestyle:cats.find(c=>c.key==="lifestyle")?.items.map(i=>i.text).filter(Boolean).join("、")||"",
            mental:   cats.find(c=>c.key==="mental")?.items.map(i=>i.text).filter(Boolean).join("、")||"",
            createdAt:existing?.createdAt||latest?.createdAt||new Date().toISOString(),
            updatedAt:new Date().toISOString(),
          };
          await DB.saveGoal(student.id,goal);
          DB.notifyGoalUpdated(student.id).catch(()=>{});
          const idx=goals.findIndex(g=>g.id===goal.id);
          if(idx>=0) goals[idx]=goal; else goals.unshift(goal);
          showSaved();
        }},["💾 保存する"]),
        savedEl,
      ]),
    );
  };

  // ── 📝 一言記録 ──
  const buildMemo=()=>{
    gContent.innerHTML="";
    const memos=getAll("memo");
    const savedEl=div({className:"hidden",style:{color:"var(--green)",fontSize:"12px"}},["✓ 保存しました"]);
    const showSaved=()=>{ savedEl.className=""; setTimeout(()=>savedEl.className="hidden",2000); };
    // 下書きはDOMに直接持たせる（タブ切替で消えないようにvalue属性で初期化）
    const memoDate=new Date().toISOString().slice(0,10);
    const dateI=inp({className:"inp",type:"date",value:memoDate});
    const memoI=ta({className:"inp",rows:3},""); memoI.placeholder="今日の気づき・練習メモ・感想など";
    const listEl=div({});
    const buildList=()=>{
      listEl.innerHTML="";
      if(!memos.length){ listEl.append(div({style:{color:"var(--muted)",fontSize:"13px",padding:"20px 0",textAlign:"center"}},["まだ記録がありません"])); return; }
      memos.slice(0,50).forEach(m=>{
        const commentEls=m.teacherComment?[div({style:{marginTop:"8px",padding:"8px 10px",background:"rgba(74,158,255,.08)",borderRadius:"6px",borderLeft:"3px solid var(--blue)"}},[
          div({style:{fontSize:"10px",color:"var(--blue)",marginBottom:"2px"}},["🏫 教員コメント"]),
          div({style:{fontSize:"13px",lineHeight:1.6}},[m.teacherComment]),
        ])]:[];
        listEl.append(div({style:{padding:"12px",marginBottom:"8px",background:"var(--card)",borderRadius:"8px",border:"1px solid var(--border)"}},[
          div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}},[
            span({style:{fontSize:"12px",color:"var(--muted)"}},[fmtDs(m.date||m.createdAt)]),
            btn({className:"btn btn-d sm",style:{padding:"1px 8px",fontSize:"10px"},onClick:async()=>{
              if(!confirm("削除しますか？"))return;
              await DB.deleteGoal(student.id,m.id);
              memos.splice(memos.indexOf(m),1); buildList();
            }},["×"]),
          ]),
          div({style:{fontSize:"13px",lineHeight:1.7,whiteSpace:"pre-wrap"}},[m.text]),
          ...commentEls,
        ]));
      });
    };
    buildList();
    gContent.append(
      div({style:{fontSize:"16px",fontWeight:700,marginBottom:"16px"}},["📝 一言記録"]),
      div({className:"card",style:{marginBottom:"16px"}},[
        ff("日付",dateI),
        div({style:{marginTop:"10px"}},[memoI]),
        div({style:{marginTop:"10px",display:"flex",gap:"8px",alignItems:"center"}},[
          btn({className:"btn btn-p",onClick:async()=>{
            const text=memoI.value.trim();
            if(!text) return;
            const goal={id:genId(),type:"memo",date:dateI.value,text,createdAt:new Date().toISOString()};
            await DB.saveGoal(student.id,goal);
            DB.notifyGoalUpdated(student.id).catch(()=>{});
            memos.unshift(goal);
            memoI.value="";
            buildList(); showSaved();
          }},["💾 記録する"]),
          savedEl,
        ]),
      ]),
      div({style:{fontWeight:600,fontSize:"14px",marginBottom:"10px"}},["過去の記録"]),
      listEl,
    );
  };

  // ── 📊 振り返り ──
  const buildReview=()=>{
    gContent.innerHTML="";
    const matchGoals=getAll("match_goal");
    const annualGoals=getAll("annual_goal");
    gContent.append(div({style:{fontSize:"16px",fontWeight:700,marginBottom:"16px"}},["📊 振り返り"]));
    const stars=n=>Array.from({length:5},(_,i)=>span({style:{color:i<n?"var(--accent)":"var(--navy-light)",fontSize:"14px"}},["★"]));

    if(annualGoals.length){
      gContent.append(div({style:{fontWeight:600,fontSize:"14px",marginBottom:"10px",color:"var(--accent)"}},[`🏆 年間目標（${annualGoals.length}件）`]));
      annualGoals.forEach(g=>{
        const areas=g.cats
          ?g.cats.filter(c=>c.items?.some(i=>i.text))
          :[["🏸 技術面",g.technical],["🤝 人間性",g.humanity],["🌅 生活面",g.lifestyle],["🧠 精神面",g.mental]].filter(([,v])=>v).map(([l,v])=>({label:l,items:[{text:v}],score:0}));
        gContent.append(div({className:"card",style:{marginBottom:"10px"}},[
          div({style:{display:"flex",justifyContent:"space-between",marginBottom:"10px"}},[
            div({style:{fontWeight:700}},[`${g.year||""}年度`]),
            span({style:{fontSize:"11px",color:"var(--muted)"}},[fmtDs(g.updatedAt||g.createdAt)]),
          ]),
          ...areas.map(cat=>div({style:{marginBottom:"8px"}},[
            div({style:{fontSize:"12px",fontWeight:700,color:"var(--muted)",marginBottom:"4px",display:"flex",alignItems:"center",gap:"6px"}},[
              cat.label,
              cat.score?div({style:{display:"flex",gap:"2px"}},[...stars(cat.score)]):"",
            ]),
            ...(cat.items||[]).filter(i=>i.text).map(i=>div({style:{marginBottom:"4px",paddingLeft:"8px"}},[
              div({style:{fontSize:"13px"}},[`• ${i.text}`]),
              i.action?div({style:{fontSize:"12px",color:"var(--accent)",paddingLeft:"12px",marginTop:"2px"}},[`→ ${i.action}`]):"",
            ])),
          ])),
        ]));
      });
    }

    if(matchGoals.length){
      gContent.append(div({style:{fontWeight:600,fontSize:"14px",marginBottom:"10px",marginTop:"16px",color:"var(--accent)"}},[`🎯 試合目標（${matchGoals.length}件）`]));
      const CLABELS={physical:"💪 体力",technical:"🏸 技術",mental:"🧠 メンタル"};
      matchGoals.forEach(g=>{
        gContent.append(div({className:"card",style:{marginBottom:"10px"}},[
          div({style:{display:"flex",justifyContent:"space-between",marginBottom:"10px"}},[
            div({style:{fontWeight:700}},[g.opponent?`vs ${g.opponent}`:"試合",g.date?span({style:{fontSize:"11px",color:"var(--muted)",marginLeft:"8px"}},[`(${fmtDs(g.date)})`]):"",]),
            span({style:{fontSize:"11px",color:"var(--muted)"}},[fmtDs(g.createdAt)]),
          ]),
          ...["physical","technical","mental"].map(k=>{
            const v=g[k]; if(!v?.goal) return "";
            return div({style:{marginBottom:"8px",paddingBottom:"8px",borderBottom:"1px solid var(--border)"}},[
              div({style:{fontSize:"12px",fontWeight:700,color:"var(--muted)",marginBottom:"3px"}},[CLABELS[k]]),
              div({style:{fontSize:"13px",marginBottom:"4px"}},[v.goal]),
              v.score?div({style:{display:"flex",gap:"2px"}},[...stars(v.score)]):"",
            ]);
          }).filter(Boolean),
        ]));
      });
    }

    if(!matchGoals.length&&!annualGoals.length){
      gContent.append(emptyState("📊","まだ目標が記録されていません。目標を設定してみましょう！"));
    }

    // 教員コメント
    if(comments.length){
      gContent.append(div({style:{fontWeight:600,fontSize:"14px",marginBottom:"10px",marginTop:"16px",color:"var(--blue)"}},[`💬 教員からのコメント（${comments.length}件）`]));
      comments.forEach(c=>{
        gContent.append(div({style:{padding:"12px",marginBottom:"8px",background:"rgba(74,158,255,.07)",borderRadius:"8px",border:"1px solid rgba(74,158,255,.2)"}},[
          div({style:{fontSize:"11px",color:"var(--blue)",marginBottom:"4px",fontWeight:700}},["🏫 教員コメント · "+fmtDs(c.createdAt)]),
          div({style:{fontSize:"13px",lineHeight:1.6,whiteSpace:"pre-wrap"}},[c.text]),
        ]));
      });
    }
  };

  switchGTab("match");
}

function generateGasCode(){
  const projectId="seikyobadomintonmanager";
  const apiKey="AIzaSyB6TbrWqu2CAzggiCqzcvr06mwnDOdEZk4";
  const clubName=S.cfg.clubName||"清教学園バドミントン部";
  const teacherEmail=S.cfg.teacherEmail||"";
  const studentEmails=S.students.filter(s=>s.email).map(s=>`"${s.email}"`).join(",\n    ");
  const coachEmails=(S.cfg.coaches||[]).filter(c=>c.email).map(c=>`"${c.email}" /* ${c.name} */`).join(",\n    ");

  // GASコードを配列で組み立て（テンプレートリテラルを避けてSyntaxErrorを防止）
  const lines = [
    "// ============================================================",
    "// " + clubName + " 選手管理システム - メール通知スクリプト",
    "// Google Apps Script に貼り付けて使用してください",
    "// トリガー設定：checkNotifications を3分ごとに実行",
    "// ============================================================",
    "",
    "const FIREBASE_PROJECT_ID = \"" + projectId + "\";",
    "const FIREBASE_API_KEY    = \"" + apiKey + "\";",
    "const CLUB_NAME           = \"" + clubName + "\";",
    "const TEACHER_EMAIL       = \"" + teacherEmail + "\";",
    "",
    "// 生徒のメールアドレス",
    "const STUDENT_EMAILS = [",
    "    " + (studentEmails||"// メールアドレスが登録されていません"),
    "];",
    "",
    "// 指導者のメールアドレス",
    "const COACH_EMAILS = [",
    "    " + (coachEmails||"// 指導者が登録されていません"),
    "];",
    "",
    "function getAllEmails() {",
    "  const all = [...STUDENT_EMAILS, ...COACH_EMAILS];",
    "  if (TEACHER_EMAIL) all.push(TEACHER_EMAIL);",
    "  return [...new Set(all)];",
    "}",
    "",
    "function getStaffEmails() {",
    "  const all = [...COACH_EMAILS];",
    "  if (TEACHER_EMAIL) all.push(TEACHER_EMAIL);",
    "  return [...new Set(all)];",
    "}",
    "",
    "function fsGet(path) {",
    "  const url = 'https://firestore.googleapis.com/v1/projects/' + FIREBASE_PROJECT_ID + '/databases/(default)/documents/' + path + '?key=' + FIREBASE_API_KEY;",
    "  const res = UrlFetchApp.fetch(url, {muteHttpExceptions: true});",
    "  if (res.getResponseCode() !== 200) return null;",
    "  return JSON.parse(res.getContentText());",
    "}",
    "",
    "function fsList(col) {",
    "  const url = 'https://firestore.googleapis.com/v1/projects/' + FIREBASE_PROJECT_ID + '/databases/(default)/documents/' + col + '?key=' + FIREBASE_API_KEY;",
    "  const res = UrlFetchApp.fetch(url, {muteHttpExceptions: true});",
    "  if (res.getResponseCode() !== 200) return [];",
    "  const data = JSON.parse(res.getContentText());",
    "  return data.documents || [];",
    "}",
    "",
    "function fPatch(path, fields) {",
    "  const url = 'https://firestore.googleapis.com/v1/projects/' + FIREBASE_PROJECT_ID + '/databases/(default)/documents/' + path + '?key=' + FIREBASE_API_KEY;",
    "  UrlFetchApp.fetch(url, {method:'PATCH', contentType:'application/json', payload:JSON.stringify({fields:fields}), muteHttpExceptions:true});",
    "}",
    "",
    "function fVal(field) {",
    "  if (!field) return null;",
    "  return field.stringValue != null ? field.stringValue : field.integerValue != null ? field.integerValue : field.booleanValue != null ? field.booleanValue : field.timestampValue != null ? field.timestampValue : null;",
    "}",
    "",
    "function checkNotifications() {",
    "  checkNewChatMessages();",
    "  checkDeadlines();",
    "  checkGreeting();",
    "  checkVenueAnnouncements();",
    "}",
    "",
    "function checkNewChatMessages() {",
    "  const props = PropertiesService.getScriptProperties();",
    "  const lastCheckKey = 'LAST_CHAT_CHECK';",
    "  const lastCheck = props.getProperty(lastCheckKey) || new Date(0).toISOString();",
    "  const rooms = fsList('chat_rooms');",
    "  const allRoomIds = ['all', ...rooms.map(r => r.name.split('/').pop())];",
    "  const newMessages = [];",
    "  allRoomIds.forEach(function(roomId) {",
    "    const msgs = fsList('chat_' + roomId);",
    "    msgs.forEach(function(m) {",
    "      const createdAt = fVal(m.fields && m.fields.createdAt);",
    "      const text = fVal(m.fields && m.fields.text);",
    "      const sender = fVal(m.fields && m.fields.senderName);",
    "      if (createdAt && createdAt > lastCheck && text) {",
    "        const roomDoc = rooms.find(r => r.name.split('/').pop() === roomId);",
    "        const roomName = roomId === 'all' ? '全体チャット' : (roomDoc && roomDoc.fields && roomDoc.fields.name ? fVal(roomDoc.fields.name) : roomId);",
    "        const isStaff = roomName.indexOf('教員') !== -1 || roomName.indexOf('指導者') !== -1;",
    "        newMessages.push({roomName:roomName, sender:sender, text:text, createdAt:createdAt, isStaff:isStaff});",
    "      }",
    "    });",
    "  });",
    "  if (newMessages.length === 0) {",
    "    props.setProperty(lastCheckKey, new Date().toISOString());",
    "    return;",
    "  }",
    "  const byRoom = {};",
    "  newMessages.forEach(function(m) {",
    "    if (!byRoom[m.roomName]) byRoom[m.roomName] = [];",
    "    byRoom[m.roomName].push(m);",
    "  });",
    "  const allEmails = getAllEmails();",
    "  const staffEmails = getStaffEmails();",
    "  Object.keys(byRoom).forEach(function(roomName) {",
    "    const msgs = byRoom[roomName];",
    "    const isStaffRoom = msgs[0].isStaff;",
    "    const targets = isStaffRoom ? staffEmails : allEmails;",
    "    const subject = '[' + CLUB_NAME + '] ' + roomName;",
    "    const body = msgs.map(function(m) { return m.sender + ': ' + m.text; }).join('\\n');",
    "    targets.forEach(function(email) {",
    "      try { GmailApp.sendEmail(email, subject, body); } catch(e) {}",
    "    });",
    "  });",
    "  props.setProperty(lastCheckKey, new Date().toISOString());",
    "}",
    "",
    "function checkDeadlines() {",
    "  const props = PropertiesService.getScriptProperties();",
    "  const now = new Date();",
    "  const in3 = new Date(now.getTime() + 3 * 24 * 60 * 60 * 1000);",
    "  const items = fsList('items');",
    "  const notifiedKey = 'DEADLINE_NOTIFIED';",
    "  const notified = JSON.parse(props.getProperty(notifiedKey) || '{}');",
    "  const targets = [];",
    "  items.forEach(function(item) {",
    "    const id = item.name.split('/').pop();",
    "    const name = fVal(item.fields && item.fields.name);",
    "    const deadline = fVal(item.fields && item.fields.deadline);",
    "    if (!deadline || !name) return;",
    "    const dl = new Date(deadline);",
    "    if (dl < now || dl > in3) return;",
    "    const dateKey = dl.toDateString();",
    "    if (notified[id] === dateKey) return;",
    "    targets.push({id:id, name:name, deadline:dl});",
    "    notified[id] = dateKey;",
    "  });",
    "  if (targets.length === 0) return;",
    "  const subject = '[' + CLUB_NAME + '] 配布物の締切が近づいています';",
    "  const body = targets.map(function(t) { return '「' + t.name + '」締切：' + t.deadline.toLocaleString('ja-JP'); }).join('\\n');",
    "  getAllEmails().forEach(function(email) {",
    "    try { GmailApp.sendEmail(email, subject, body); } catch(e) {}",
    "  });",
    "  props.setProperty(notifiedKey, JSON.stringify(notified));",
    "}",
    "",
    "function checkGreeting() {",
    "  const data = fsGet('notifications/greeting');",
    "  if (!data) return;",
    "  const notified = data.fields && data.fields.notified && data.fields.notified.booleanValue;",
    "  const text = fVal(data.fields && data.fields.text);",
    "  if (notified || !text) return;",
    "  const subject = '[' + CLUB_NAME + '] お知らせ';",
    "  getAllEmails().forEach(function(email) {",
    "    try { GmailApp.sendEmail(email, subject, text); } catch(e) {}",
    "  });",
    "  fPatch('notifications/greeting', {text:{stringValue:text}, notified:{booleanValue:true}, updatedAt:{timestampValue:new Date().toISOString()}});",
    "}",
    "",
    "function checkVenueAnnouncements() {",
    "  const url = 'https://firestore.googleapis.com/v1/projects/' + FIREBASE_PROJECT_ID + '/databases/(default)/documents/notifications?key=' + FIREBASE_API_KEY;",
    "  const res = UrlFetchApp.fetch(url, {muteHttpExceptions:true});",
    "  if (res.getResponseCode() !== 200) return;",
    "  const data = JSON.parse(res.getContentText());",
    "  if (!data.documents) return;",
    "  data.documents.forEach(function(doc) {",
    "    const id = doc.name.split('/').pop();",
    "    if (id.indexOf('venue_') !== 0) return;",
    "    const notified = doc.fields && doc.fields.notified && doc.fields.notified.booleanValue;",
    "    const text = fVal(doc.fields && doc.fields.text);",
    "    if (notified || !text) return;",
    "    const subject = '[' + CLUB_NAME + '] 会場のお知らせ';",
    "    getAllEmails().forEach(function(email) {",
    "      try { GmailApp.sendEmail(email, subject, text); } catch(e) {}",
    "    });",
    "    fPatch('notifications/' + id, {text:{stringValue:text}, notified:{booleanValue:true}, updatedAt:{timestampValue:new Date().toISOString()}});",
    "  });",
    "}",
  ];
  return lines.join("\n");
}

if("serviceWorker" in navigator){
  const swCode=`
self.addEventListener("install",e=>{ self.skipWaiting(); });
self.addEventListener("activate",e=>{ e.waitUntil(clients.claim()); });
self.addEventListener("fetch",e=>{ e.respondWith(fetch(e.request).catch(()=>new Response("offline"))); });
`;
  const blob=new Blob([swCode],{type:"application/javascript"});
  const swUrl=URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}
